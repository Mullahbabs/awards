        display: grid;
        place-items: center;
        border-radius: var(--r-full);
        color: #fff;
        transition: background-color var(--dur-base) var(--ease-out);
      }
      .lightbox__close:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .lightbox__stage {
        display: grid;
        place-items: center;
        padding: var(--s-4);
        position: relative;
        min-height: 0;
      }
      .lightbox__art {
        width: min(1000px, 100%);
        aspect-ratio: 16/10;
        border-radius: var(--r-lg);
        position: relative;
        overflow: hidden;
        box-shadow: var(--sh-xl);
        background-size: cover;
        background-position: center;
      }
      .lightbox__nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 52px;
        height: 52px;
        border-radius: var(--r-full);
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.28);
        transition: background-color var(--dur-base) var(--ease-out);
      }
      .lightbox__nav:hover {
        background: rgba(255, 255, 255, 0.24);
      }
      .lightbox__nav--prev {
        left: clamp(8px, 2vw, 24px);
      }
      .lightbox__nav--next {
        right: clamp(8px, 2vw, 24px);
      }
      .lightbox__caption {
        padding: var(--s-5) var(--shell-pad)
          calc(var(--s-6) + env(safe-area-inset-bottom));
        color: #fff;
        text-align: center;
        max-width: 70ch;
        margin-inline: auto;
        font-size: 0.9375rem;
        line-height: 1.6;
      }

      /* PAGE HEADER (interior) */
      .page-head {
        position: relative;
        isolation: isolate;
        color: #fff;
        overflow: hidden;
        padding-top: calc(var(--header-h) + clamp(48px, 8vw, 96px));
        padding-bottom: clamp(48px, 7vw, 88px);
        background: var(--brand-900);
      }
      .page-head__inner {
        position: relative;
        z-index: 2;
      }
      .page-head__title {
        font-family: var(--font-display);
        font-size: var(--fs-display-l);
        line-height: 1.05;
        letter-spacing: var(--ls-tighter);
        max-width: 18ch;
        margin-top: var(--s-5);
        color: #fff;
        text-shadow: 0 2px 24px rgba(10, 30, 74, 0.4);
      }
      .page-head__desc {
        color: rgba(255, 255, 255, 0.82);
        max-width: 60ch;
        margin-top: var(--s-5);
        font-size: 1.0625rem;
        line-height: 1.7;
      }

      .crumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.72);
        margin-bottom: var(--s-2);
      }
      .crumbs a:hover {
        color: var(--amber-400);
      }
      .crumbs span[aria-hidden] {
        opacity: 0.5;
      }

      .empty-state {
        display: grid;
        gap: var(--s-4);
        justify-items: center;
        text-align: center;
        padding: clamp(48px, 8vw, 88px) var(--s-5);
        border: 1px dashed var(--border-light);
        border-radius: var(--r-lg);
        background: var(--ivory-50);
      }
      .empty-state svg {
        width: 36px;
        height: 36px;
        color: var(--ink-300);
      }
      .empty-state__title {
        font-family: var(--font-display);
        font-size: 1.375rem;
        letter-spacing: -0.015em;
      }
      .empty-state__desc {
        color: var(--ink-500);
        max-width: 44ch;
        font-size: 0.9375rem;
        line-height: 1.65;
      }

      .mt-6 {
        margin-top: var(--s-6);
      }
      .mt-8 {
        margin-top: var(--s-8);
      }
      .center {
        text-align: center;
      }

      /* Filter bar */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-3);
        align-items: center;
        margin-bottom: var(--s-8);
      }
      .search-field {
        position: relative;
        flex: 1 1 260px;
        min-width: 0;
        max-width: 380px;
      }
      .search-field svg {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        color: var(--ink-400);
        pointer-events: none;
      }
      .search-field input {
        width: 100%;
        padding: 14px 18px 14px 46px;
        background: #fff;
        border: 1px solid var(--border-light);
        border-radius: var(--r-full);
        font-size: 0.9375rem;
        transition:
          border-color var(--dur-base) var(--ease-out),
          box-shadow var(--dur-base) var(--ease-out);
      }
      .search-field input::placeholder {
        color: var(--ink-400);
      }
      .search-field input:focus {
        border-color: var(--amber-500);
        box-shadow: 0 0 0 4px rgba(245, 165, 36, 0.18);
      }
      .filter-chips {
        display: flex;
        gap: var(--s-2);
        flex-wrap: wrap;
      }
      .chip {
        padding: 9px 16px;
        font-size: 0.8125rem;
        font-weight: 500;
        border: 1px solid var(--border-light);
        border-radius: var(--r-full);
        background: transparent;
        color: var(--ink-600);
        transition: all var(--dur-base) var(--ease-out);
      }
      .chip:hover {
        border-color: var(--ink-400);
        color: var(--ink-900);
      }
      .chip[aria-pressed="true"] {
        background: var(--brand-700);
        border-color: var(--brand-700);
        color: #fff;
      }

      /* Nominee detail */
      .nominee-body {
        display: grid;
        gap: clamp(32px, 5vw, 72px);
      }
      @media (min-width: 900px) {
        .nominee-body {
          grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.9fr);
        }
      }
      .nominee-hero-media {
        position: relative;
        aspect-ratio: 16/10;
        border-radius: var(--r-lg);
        overflow: hidden;
        background: var(--brand-800);
        box-shadow: var(--sh-lg);
      }
      .nominee-hero-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;

        function esc(str) {
          return String(str ?? "").replace(
            /[&<>"']/g,
            (ch) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",

            .replace(/[^\p{L}\p{N} ]/gu, " ")
            .split(/\s+/)
            .filter(Boolean)
            .slice(0, 2)
            .map((w) => w[0].toUpperCase())
            .join("");

        function trapFocus(container) {
          const selector =
            'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
          function handler(e) {
            if (e.key !== "Tab") return;
            const nodes = $$(selector, container).filter(
              (el) => el.offsetParent !== null || el === document.activeElement,
            );
            if (!nodes.length) return;
            const first = nodes[0],
              last = nodes[nodes.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
          container.addEventListener("keydown", handler);
          return () => container.removeEventListener("keydown", handler);
        }

        /* ==========================================================================
   5. VOTE STORAGE — localStorage for per-category vote locks
   ========================================================================== */
        const VoteStorage = (() => {
          const KEY = "pfa.votes.v1";
          function load() {
            try {
              const raw = localStorage.getItem(KEY);
              return raw ? JSON.parse(raw) : {};
            } catch {
              return {};
            }
          }
          function save(votes) {
            try {
              localStorage.setItem(KEY, JSON.stringify(votes));
            } catch {}
          }
          function record(categoryId, nomineeId, meta) {
            const all = load();
            all[categoryId] = Object.assign(
              { nomineeId, timestamp: new Date().toISOString() },
              meta || {},
            );
            save(all);
            return all;
          }
          function hasVotedIn(categoryId) {
            return Boolean(load()[categoryId]);
          }
          function getVote(categoryId) {
            return load()[categoryId] || null;
          }
          function getAll() {
            return load();
          }
          function countVoted() {
            return Object.keys(load()).length;
          }
          return {
            load,
            save,
            record,
            hasVotedIn,
            getVote,
            getAll,
            countVoted,
          };
        })();

        /* ==========================================================================
   6. ROUTER — hash-based, works from any host, no 404 possible
   ========================================================================== */
        const state = {
          route: { name: "home", params: {} },
          galleryIndex: 0,
          myVotes: VoteStorage.load(),
        };

        function parseHash() {
          const raw = location.hash.replace(/^#/, "") || "/";
          const [pathPart, queryPart] = raw.split("?");
          const query = new URLSearchParams(queryPart || "");
          const clean = pathPart.replace(/\/+$/, "") || "/";

          const ROUTES = {
            "/": { name: "home" },
            "/about": { name: "about" },
            "/categories": { name: "categories" },
            "/nominees": { name: "nominees" },
            "/vote": { name: "vote" },
            "/event": { name: "event" },
            "/gallery": { name: "gallery" },
            "/faq": { name: "faq" },
            "/contact": { name: "contact" },
          };
          if (ROUTES[clean]) return { ...ROUTES[clean], params: { query } };

          let m = clean.match(/^\/categories\/([^/]+)$/);
          if (m) return { name: "category", params: { slug: m[1], query } };

          m = clean.match(/^\/nominees\/([^/]+)$/);
          if (m) return { name: "nominee", params: { id: m[1], query } };

          /* Unknown hashes fall back to home — never a 404 */
          return { name: "home", params: { query } };
        }

        function navigate(hash, { replace = false } = {}) {
          const target = hash.startsWith("#") ? hash : "#" + hash;
          if (replace) history.replaceState({}, "", target);
          else location.hash = target;
          /* location.hash change fires hashchange → render */
          if (replace) render();
        }

        function currentHash() {
          return location.hash || "#/";
        }
        window.addEventListener("hashchange", render);

  </svg>`;
        }

            toggle.setAttribute("aria-expanded", "false");
            if (drawerCleanup) drawerCleanup();

            setTimeout(() => {
              root.innerHTML = "";

          }

          scrim.addEventListener("click", close);
          $$("[data-drawer-close]", root).forEach((el) =>
            el.addEventListener("click", close),

        function toast(message, variant = "success") {
          const region = $("#toast-region");
          const el = document.createElement("div");
          el.className = `toast toast--${variant}`;
          el.innerHTML = `${icon(variant === "error" ? "alert" : "check")}<span>${esc(message)}</span>`;
          region.appendChild(el);
          setTimeout(() => {
            el.style.transition = "opacity 300ms, transform 300ms";
            el.style.opacity = "0";
            el.style.transform = "translateY(-8px)";
            setTimeout(() => el.remove(), 320);
          }, 4200);
        }

        /* ==========================================================================
   8. VOTE MODAL — the only voting entry point
   ========================================================================== */
        function isEmailjsConfigured() {
          const c = CONFIG.emailjs;
          return Boolean(
            window.emailjs &&
            c.publicKey &&
            c.publicKey !== "YOUR_PUBLIC_KEY_HERE" &&
            c.serviceId &&
            c.serviceId !== "YOUR_SERVICE_ID_HERE" &&
            c.templateId &&
            c.templateId !== "YOUR_TEMPLATE_ID_HERE",
          );
        }

        function openVoteModal(nominee) {
          if (!nominee) return;
          const cat = CATEGORY_BY_ID[nominee.categoryId];

          /* Already voted in this category → show locked state */
          const existing = VoteStorage.getVote(nominee.categoryId);
          if (existing) {
            const prev = NOMINEE_BY_ID[existing.nomineeId];
            openLockedModal(cat, prev, existing);
            return;
          }

          const root = $("#modal-root");
          const posterUrl = `./img/nominees/${nominee.id}.jpg`;

          root.innerHTML = `
    <div class="modal-scrim" data-open="false" data-scrim>

        <div class="vote-modal__nominee">

                 onerror="this.style.display='none';this.parentNode.style.background='linear-gradient(135deg,#1D4EC4,#0A1E4A)';this.parentNode.innerHTML='<div style=\\'display:grid;place-items:center;width:100%;height:100%;font-family:Fraunces,serif;font-size:2rem;color:#fff\\'>${esc(initials(nominee.name))}</div>'" />
          </div>
          <div>
            <p class="vote-modal__eyebrow">${esc(cat ? cat.name : "Award Category")}</p>

          </div>
        </div>

        <div class="form-grid">
          <div class="form-field">
            <label for="voter-name">Full name</label>
            <input id="voter-name" name="voter_name" type="text" autocomplete="name"

            <span class="form-field__error" data-error-for="voter_name"></span>
          </div>
          <div class="form-field">
            <label for="voter-phone">Phone number</label>
            <input id="voter-phone" name="voter_phone" type="tel" autocomplete="tel"

            <span class="form-field__error" data-error-for="voter_phone"></span>
          </div>

            ${icon("arrowRight", "btn__icon btn__icon--arrow")}

        </div>
      </form>
    </div>

          const scrim = $(".modal-scrim", root);
          const modal = $(".modal", root);
          const form = $("[data-vote-form]", modal);
          const submitBtn = $("[data-submit]", modal);
          const submitLabel = $("[data-submit-label]", modal);
          const prevFocus = document.activeElement;

          requestAnimationFrame(() => {
            scrim.dataset.open = "true";
          });
          document.body.classList.add("no-scroll");
          const removeTrap = trapFocus(modal);
          $("#voter-name", modal).focus();

          function close() {
            scrim.dataset.open = "false";
            document.body.classList.remove("no-scroll");
            removeTrap();
            prevFocus && prevFocus.focus();
            setTimeout(() => {
              root.innerHTML = "";
            }, 340);
          }

          function setError(fieldName, message) {
            const input = $(`[name="${fieldName}"]`, modal);
            const error = $(`[data-error-for="${fieldName}"]`, modal);
            if (input)
              input.setAttribute("aria-invalid", message ? "true" : "false");
            if (error) error.textContent = message || "";
          }

          function validate() {
            ["voter_name", "voter_phone", "voter_email"].forEach((n) =>
              setError(n, ""),
            );
            const name = $("[name='voter_name']", modal).value.trim();
            const phone = $("[name='voter_phone']", modal).value.trim();
            const email = $("[name='voter_email']", modal).value.trim();
            let ok = true;
            let firstInvalid = null;
            if (name.length < 2) {
              setError("voter_name", "Please enter your full name.");
              ok = false;
              firstInvalid = firstInvalid || $("[name='voter_name']", modal);
            }
            if (phone.length < 7 || !/^[+\d\s().-]+$/.test(phone)) {
              setError("voter_phone", "Please enter a valid phone number.");
              ok = false;
              firstInvalid = firstInvalid || $("[name='voter_phone']", modal);
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
              setError("voter_email", "Please enter a valid email address.");
              ok = false;
              firstInvalid = firstInvalid || $("[name='voter_email']", modal);
            }
            if (!ok && firstInvalid) firstInvalid.focus();
            return ok ? { name, phone, email } : null;
          }

          ["voter_name", "voter_phone", "voter_email"].forEach((n) => {
            $(`[name="${n}"]`, modal).addEventListener("input", () =>
              setError(n, ""),
            );
          });

          $("[data-cancel]", modal).addEventListener("click", close);
          scrim.addEventListener("click", (e) => {
            if (e.target === scrim) close();
          });
          modal.addEventListener("keydown", (e) => {
            if (e.key === "Escape") close();
          });

          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const voter = validate();
            if (!voter) {
              toast("Please check the highlighted fields.", "error");
              return;
            }

            submitBtn.disabled = true;

        async function submitVote({ nominee, category, voter }) {
          const reference =
            "PFA-" +
            new Date().getFullYear() +
            "-" +
            Math.random().toString(36).slice(2, 8).toUpperCase();
          const submittedAt = new Date();
          const submittedAtISO = submittedAt.toISOString();
          const submittedAtLabel = submittedAt.toLocaleString("en-GB", {
            day: "numeric",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });

          const params = {
            to_email: CONFIG.emailjs.toEmail,
            to_name: CONFIG.org.name,

            subject: `New Vote — ${category ? category.name : "Category"} — ${nominee.name}`,

            reference,
            submitted_at: submittedAtLabel,
            submitted_at_iso: submittedAtISO,

            voter_name: voter.name,
            voter_phone: voter.phone,
            voter_email: voter.email,

            category_name: category ? category.name : "",
            category_id: category ? category.id : "",
            nominee_name: nominee.name,
            nominee_id: nominee.id,
            nominee_location: nominee.location,
            nominee_description: nominee.description,
            nominee_percent: nominee.votes + "%",

            organiser: CONFIG.org.organiser,
            partner: CONFIG.org.partner,
            region: CONFIG.org.region,
          };

          if (isEmailjsConfigured()) {
            try {
              await window.emailjs.send(
                CONFIG.emailjs.serviceId,
                CONFIG.emailjs.templateId,
                params,
                { publicKey: CONFIG.emailjs.publicKey },
              );
            } catch (err) {
              console.error("EmailJS send failed:", err);
              const e = new Error(
                (err && err.text) ||
                  "We could not deliver your vote. Please check your connection and try again.",
              );
              e.code = "EMAILJS";
              throw e;
            }
          } else {
            /* Demo mode — no credentials configured */
            console.warn(
              "[PFA] EmailJS is not configured. Add publicKey, serviceId, and templateId in CONFIG.emailjs. " +
                "Running in demo mode — no email was actually sent.",
            );
            console.info("[PFA] Vote payload:", params);
            await new Promise((r) => setTimeout(r, 900));
          }

          return { reference, submittedAt: submittedAtISO };
        }

        function initHero() {
          const hero = $("#hero");
          if (!hero) return;
          const reduced = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;
          heroSlides = $$(".hero__slide", hero);
          const dots = $$("[data-hero-dot]", hero);
          const eyebrowEl = $("[data-hero-eyebrow]", hero);
          const titleEl = $("[data-hero-title]", hero);
          const copyEl = $("[data-hero-copy]", hero);
          if (!heroSlides.length) return;

          function goTo(index) {
            heroIndex = (index + heroSlides.length) % heroSlides.length;
            heroSlides.forEach((el, i) => {
              const active = i === heroIndex;
              el.dataset.active = String(active);
              el.setAttribute("aria-hidden", String(!active));
            });
            dots.forEach((d, i) =>
              d.setAttribute("aria-selected", String(i === heroIndex)),
            );
            const s = HERO_SLIDES[heroIndex];
            const apply = () => {
              eyebrowEl.textContent = s.eyebrow;
              titleEl.innerHTML = s.title;
              copyEl.textContent = s.copy;
            };
            if (reduced) {
              apply();
            } else {
              [eyebrowEl, titleEl, copyEl].forEach((el) => {
                el.style.transition =
                  "opacity 320ms var(--ease-out), transform 320ms var(--ease-out)";
                el.style.opacity = "0";
                el.style.transform = "translateY(10px)";
              });
              setTimeout(() => {
                apply();
                [eyebrowEl, titleEl, copyEl].forEach((el, i) => {
                  el.style.transitionDelay = i * 60 + "ms";
                  el.style.opacity = "1";
                  el.style.transform = "none";
                });
              }, 200);
            }
            restartAutoplay();
          }
          function restartAutoplay() {
            clearInterval(heroTimer);
            if (reduced || heroPaused) return;
            heroTimer = setInterval(() => goTo(heroIndex + 1), 7500);
          }
          function stopAutoplay() {
            clearInterval(heroTimer);
          }

          $("[data-hero-prev]", hero).addEventListener("click", () =>
            goTo(heroIndex - 1),
          );
          $("[data-hero-next]", hero).addEventListener("click", () =>
            goTo(heroIndex + 1),
          );
          dots.forEach((d) =>
            d.addEventListener("click", () => goTo(Number(d.dataset.heroDot))),
          );
          hero.addEventListener("mouseenter", () => {
            heroPaused = true;
            stopAutoplay();
          });
          hero.addEventListener("mouseleave", () => {
            heroPaused = false;
            restartAutoplay();
          });
          hero.addEventListener("focusin", stopAutoplay);
          hero.addEventListener("focusout", restartAutoplay);
          hero.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") {
              e.preventDefault();
              goTo(heroIndex - 1);
            }
            if (e.key === "ArrowRight") {
              e.preventDefault();
              goTo(heroIndex + 1);
            }
          });
          let startX = null,
            startY = null;
          hero.addEventListener(
            "pointerdown",
            (e) => {
              if (e.pointerType === "mouse") return;
              startX = e.clientX;
              startY = e.clientY;
            },
            { passive: true },
          );
          hero.addEventListener(
            "pointerup",
            (e) => {
              if (startX === null) return;
              const dx = e.clientX - startX,
                dy = e.clientY - startY;
              if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy))
                goTo(dx < 0 ? heroIndex + 1 : heroIndex - 1);
              startX = null;
              startY = null;
            },
            { passive: true },
          );
          document.addEventListener("visibilitychange", () => {
            if (document.hidden) stopAutoplay();
            else restartAutoplay();
          });
          restartAutoplay();
        }

          function renderResults(q) {
            const query = q.trim().toLowerCase();
            if (!query) {
              close();
              return;
            }
            const matches = NOMINEES.filter(
              (n) =>
                n.name.toLowerCase().includes(query) ||
                n.location.toLowerCase().includes(query) ||
                (CATEGORY_BY_ID[n.categoryId]?.name || "")
                  .toLowerCase()
                  .includes(query),
            ).slice(0, 8);

            if (!matches.length) {
              results.innerHTML = `<div class="qs-empty">No nominees match "<strong>${esc(q)}</strong>".</div>`;
            } else {
              results.innerHTML = matches
                .map((n) => {
                  const cat = CATEGORY_BY_ID[n.categoryId];

                  return `

          input.addEventListener("focus", () => {
            if (input.value.trim()) renderResults(input.value);
          });
          document.addEventListener("click", (e) => {

          });

        function initCountdown() {
          const root = $("[data-countdown]");
          if (!root) return;
          const target = Date.parse(CONFIG.event.startISO);
          const values = $$("[data-cd]", root);
          const rings = $$("[data-ring]", root);
          const CIRC = 289;
          const UNIT_MS = [86400000, 3600000, 60000, 1000];
          const UNIT_MAX = [365, 24, 60, 60];
          const pad = (n) => String(n).padStart(2, "0");

          function tick() {
            let diff = target - Date.now();
            if (diff < 0) diff = 0;
            const units = [
              Math.floor(diff / UNIT_MS[0]),
              Math.floor((diff / UNIT_MS[1]) % 24),
              Math.floor((diff / UNIT_MS[2]) % 60),
              Math.floor((diff % 60000) / 1000),
            ];
            units.forEach((val, i) => {
              if (values[i]) values[i].textContent = pad(val);
              if (rings[i]) {
                const progress = Math.min(val / UNIT_MAX[i], 1);
                rings[i].style.strokeDashoffset = String(CIRC * (1 - progress));
              }
            });
          }
          tick();
          /* Fixed-interval timer that continues indefinitely — no page-disappear behaviour */
          setInterval(tick, 1000);
        }

        function buildIcsDataUri() {
          const e = CONFIG.event;
          const fmt = (iso) =>
            new Date(iso)
              .toISOString()
              .replace(/[-:]/g, "")
              .replace(/\.\d{3}/, "");
          const lines = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//People First Awards//EN",
            "CALSCALE:GREGORIAN",
            "BEGIN:VEVENT",
            `UID:${Date.now()}@peoplesfirstawards.example`,
            `DTSTAMP:${fmt(new Date().toISOString())}`,
            `DTSTART:${fmt(e.startISO)}`,
            `DTEND:${fmt(e.endISO)}`,
            `SUMMARY:${e.name}`,
            `LOCATION:${e.venue}\\, ${e.city}\\, ${e.country}`,
            `DESCRIPTION:Organised by ${CONFIG.org.organiser} through ${CONFIG.org.partner}.`,
            "END:VEVENT",
            "END:VCALENDAR",
          ];
          return (
            "data:text/calendar;charset=utf-8," +
            encodeURIComponent(lines.join("\r\n"))
          );
        }
        function googleCalendarUrl() {
          const e = CONFIG.event;
          const fmt = (iso) =>
            new Date(iso)
              .toISOString()
              .replace(/[-:]/g, "")
              .replace(/\.\d{3}/, "");
          const params = new URLSearchParams({
            action: "TEMPLATE",
            text: e.name,
            dates: `${fmt(e.startISO)}/${fmt(e.endISO)}`,
            details: `Organised by ${CONFIG.org.organiser} through ${CONFIG.org.partner}.`,
            location: `${e.venue}, ${e.city}, ${e.country}`,
          });
          return (
            "https://calendar.google.com/calendar/render?" + params.toString()
          );
        }
        function outlookCalendarUrl() {
          const e = CONFIG.event;
          const params = new URLSearchParams({
            path: "/calendar/action/compose",
            rru: "addevent",
            subject: e.name,
            startdt: new Date(e.startISO).toISOString(),
            enddt: new Date(e.endISO).toISOString(),
            location: `${e.venue}, ${e.city}, ${e.country}`,
            body: `Organised by ${CONFIG.org.organiser} through ${CONFIG.org.partner}.`,
          });
          return (
            "https://outlook.live.com/calendar/0/deeplink/compose?" +
            params.toString()
          );

        let lightboxCleanup = null;
        function openLightbox(index) {
          state.galleryIndex = index;
          const root = $("#lightbox-root");

          function render() {
            const item = GALLERY_ITEMS[state.galleryIndex];
            root.innerHTML = `
      <div class="lightbox" data-open="false" role="dialog" aria-modal="true" aria-label="Image viewer" data-lightbox>
        <div class="lightbox__bar">
          <span class="lightbox__counter">${state.galleryIndex + 1} / ${GALLERY_ITEMS.length}</span>

          <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next image" data-lb-next>${icon("arrowRight")}</button>
        </div>
        <p class="lightbox__caption" data-lb-caption>${esc(item.caption)}</p>
      </div>`;
          }
          render();

          const lb = $("[data-lightbox]", root);
          requestAnimationFrame(() => {
            lb.dataset.open = "true";
          });
          document.body.classList.add("no-scroll");
          const prevFocus = document.activeElement;
          $("[data-lb-close]", lb).focus();

          function close() {
            lb.dataset.open = "false";
            document.body.classList.remove("no-scroll");
            if (lightboxCleanup) lightboxCleanup();
            prevFocus && prevFocus.focus();
            setTimeout(() => {
              root.innerHTML = "";
            }, 320);
          }
          function go(delta) {
            state.galleryIndex =
              (state.galleryIndex + delta + GALLERY_ITEMS.length) %
              GALLERY_ITEMS.length;
            const item = GALLERY_ITEMS[state.galleryIndex];
            const art = $("[data-lb-art]", lb);
            art.style.opacity = "0";
            setTimeout(() => {
              art.className = `lightbox__art img-cover img-cover--gallery-${item.tone}`;
              $("[data-lb-caption]", lb).textContent = item.caption;
              $(".lightbox__counter", lb).textContent =
                `${state.galleryIndex + 1} / ${GALLERY_ITEMS.length}`;
              art.style.transition = "opacity 300ms";
              art.style.opacity = "1";
            }, 140);
          }
          $("[data-lb-close]", lb).addEventListener("click", close);
          $("[data-lb-prev]", lb).addEventListener("click", () => go(-1));
          $("[data-lb-next]", lb).addEventListener("click", () => go(1));
          lb.addEventListener("keydown", (e) => {
            if (e.key === "Escape") close();
            if (e.key === "ArrowLeft") go(-1);
            if (e.key === "ArrowRight") go(1);
          });
          lightboxCleanup = trapFocus(lb);
        }

              const panel = document.getElementById(

        function ContactView() {
          return `
  <header class="page-head">
    <div class="img-cover img-cover--page-head" aria-hidden="true"></div>
    <div class="shell page-head__inner">
      <nav class="crumbs" aria-label="Breadcrumb">

  <section class="section" style="background:var(--ivory-50)">
    <div class="shell">
      <div style="display:grid;gap:clamp(32px,5vw,72px)" class="contact-grid">
        <div>
          <p class="eyebrow" style="margin-bottom:var(--s-4)">Get in touch</p>

          <dl style="display:grid;gap:var(--s-5)">

            </div>
            <div>
              <dt style="font-size:.625rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin-bottom:6px">Email</dt>
              <dd><a class="link-underline" href="mailto:${esc(CONFIG.org.email)}">${esc(CONFIG.org.email)}</a></dd>

            <div>
              <dt style="font-size:.625rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin-bottom:6px">Phone</dt>
              <dd><a class="link-underline" href="tel:${esc(CONFIG.org.phone.replace(/\s/g, ""))}">${esc(CONFIG.org.phone)}</a></dd>
            </div>
            <div>
              <dt style="font-size:.625rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500);margin-bottom:6px">Office</dt>
              <dd style="font-size:.9375rem">${esc(CONFIG.org.address)}</dd>
            </div>
          </dl>
        </div>
        <form style="display:grid;gap:var(--s-5);border:1px solid var(--border-light);border-radius:var(--r-lg);padding:clamp(24px,3.4vw,40px);background:#fff;box-shadow:var(--sh-sm)"
              data-contact-form novalidate>
          <h3 class="display-s">Send a message</h3>
          <label style="display:grid;gap:6px">
            <span style="font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-600)">Full name</span>
            <input required name="name" autocomplete="name"
              style="padding:13px 16px;border:1px solid var(--border-light);border-radius:var(--r-sm);background:#fff;font-size:.9375rem" />
          </label>
          <label style="display:grid;gap:6px">
            <span style="font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-600)">Email address</span>
            <input required type="email" name="email" autocomplete="email"
              style="padding:13px 16px;border:1px solid var(--border-light);border-radius:var(--r-sm);background:#fff;font-size:.9375rem" />
          </label>
          <label style="display:grid;gap:6px">
            <span style="font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-600)">Message</span>
            <textarea required name="message" rows="5"
              style="padding:13px 16px;border:1px solid var(--border-light);border-radius:var(--r-sm);background:#fff;font-size:.9375rem;resize:vertical;font-family:inherit"></textarea>
          </label>
          <button class="btn btn--brand btn--block" type="submit">Send message</button>
        </form>

  </section>
  <style>@media (min-width:900px){.contact-grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}</style>`;
        }

        function initContactForm() {
          const form = $("[data-contact-form]");
          if (!form) return;
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            toast("Thanks — this demo form is not yet connected.", "error");
          });
        }

        /* ==========================================================================
   13. RENDER PIPELINE
   ========================================================================== */
        function renderView() {
          const { name, params } = state.route;
          switch (name) {
            case "home":
              return HomeView();
            case "about":
              return AboutView();
            case "categories":
              return CategoriesView();
            case "category":
              return CategoryDetailView(params);
            case "nominees":
              return NomineesView();
            case "nominee":
              return NomineeDetailView(params);
            case "vote":
              return VoteView();
            case "event":
              return EventView();
            case "gallery":
              return GalleryView();
            case "faq":
              return FaqView();
            case "contact":
              return ContactView();
            default:
              return HomeView();
          }
        }

        function initReveal() {
          const nodes = $$(".reveal:not(.is-visible)");
          if (!nodes.length) return;
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            nodes.forEach((n) => n.classList.add("is-visible"));
            return;
          }
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  io.unobserve(entry.target);
                }
              });
            },
            { rootMargin: "0px 0px -8% 0px", threshold: 0.08 },
          );
          nodes.forEach((n) => io.observe(n));
        }

        function initCounters() {
          const nodes = $$("[data-counter]");
          if (!nodes.length) return;
          const reduced = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                const el = entry.target;
                const target = Number(el.dataset.counter);
                io.unobserve(el);
                if (reduced) {
                  el.textContent = target.toLocaleString("en-GB");
                  return;
                }
                const duration = 1500;
                const start = performance.now();
                function frame(now) {
                  const t = Math.min((now - start) / duration, 1);
                  const eased = 1 - Math.pow(1 - t, 3);
                  el.textContent = Math.round(target * eased).toLocaleString(
                    "en-GB",
                  );
                  if (t < 1) requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
              });
            },
            { threshold: 0.4 },
          );
          nodes.forEach((n) => io.observe(n));
        }

        function initLinkInterception() {
          document.addEventListener("click", (e) => {
            const link = e.target.closest("a[data-link]");
            if (!link) return;
            const href = link.getAttribute("href");
            if (!href) return;
            /* Only intercept hash links; leave external anchors alone */
            if (href.startsWith("#")) {
              e.preventDefault();
              /* Close any open drawer */
              const closeBtn = $(".drawer__close");
              if (
                closeBtn &&
                document.body.classList.contains("no-scroll") === false
              ) {
                /* drawer not open — safe */
              }
              navigate(href);
            }
          });
        }

        function updateMeta() {
          const { name } = state.route;
          const titles = {
            home: `${CONFIG.org.name} — ${CONFIG.org.tagline}`,
            about: `About — ${CONFIG.org.name}`,
            categories: `Award Categories — ${CONFIG.org.name}`,
            category: `${CATEGORY_BY_ID[state.route.params.slug]?.name || "Category"} — ${CONFIG.org.name}`,
            nominees: `Nominees — ${CONFIG.org.name}`,
            nominee: `${NOMINEE_BY_ID[state.route.params.id]?.name || "Nominee"} — ${CONFIG.org.name}`,
            vote: `Vote — ${CONFIG.org.name}`,
            event: `The Ceremony — ${CONFIG.org.name}`,
            gallery: `Gallery — ${CONFIG.org.name}`,
            faq: `FAQ — ${CONFIG.org.name}`,
            contact: `Contact — ${CONFIG.org.name}`,
          };
          document.title = titles[name] || CONFIG.org.name;
        }

        function updateHeaderState() {
          const header = $("#site-header");
          if (!header) return;
          const isHome = state.route.name === "home";
          const scrolled = window.scrollY > 24;
          const solid = !isHome || scrolled;
          header.className =
            "site-header " +
            (solid ? "site-header--solid" : "site-header--transparent");
        }

        function render() {
          state.route = parseHash();

          const main = $("#main");
          main.innerHTML = renderView();

          renderHeader();
          $("#site-footer").innerHTML = renderFooter();

          const { name } = state.route;

          /* Global interactions */
          bindVoteButtons();
          initLinkInterception();

          /* View-specific initialisers */
          if (name === "home") {
            initHero();
            initQuickSearch();
            initCountdown();
            initCalendarLinks();
            initCategoryFilter();
            initNomineeFilter();
            initFaq();
            bindGalleryButtons();
          }
          if (name === "categories" || name === "category")
            initCategoryFilter();
          if (name === "nominees") initNomineeFilter();
          if (name === "vote") initVotePage();
          if (name === "event") {
            initCountdown();
            initCalendarLinks();
          }
          if (name === "gallery") bindGalleryButtons();
          if (name === "faq") initFaq();
          if (name === "contact") initContactForm();

          initReveal();
          initCounters();

          window.scrollTo({ top: 0, behavior: "auto" });
          updateHeaderState();
          updateMeta();
        }

        /* ==========================================================================
   14. BOOT
   ========================================================================== */
        let scrollRaf = null;
        window.addEventListener(
          "scroll",
          () => {
            if (scrollRaf) return;
            scrollRaf = requestAnimationFrame(() => {
              updateHeaderState();
              scrollRaf = null;
            });
          },
          { passive: true },
        );

        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && drawerCleanup) {
            const closeBtn = $(".drawer__close");
            if (closeBtn) closeBtn.click();
          }
        });

        (function initEmailjs() {
          const c = CONFIG.emailjs;
          const ready =
            window.emailjs &&
            c.publicKey &&
            c.publicKey !== "YOUR_PUBLIC_KEY_HERE";
          if (ready) {
            try {
              window.emailjs.init({ publicKey: c.publicKey });
              console.info("[PFA] EmailJS initialised.");
            } catch (err) {
              console.warn("[PFA] EmailJS initialisation failed:", err);
            }
          } else {
            console.info(
              "[PFA] EmailJS credentials not set. Add publicKey, serviceId and templateId in CONFIG.emailjs.",
            );
          }
        })();

        /* Ensure URL always has a hash so nothing can 404 */
        if (!location.hash) history.replaceState({}, "", "#/");

        render();

        window.PFA = {
          CONFIG,
          CATEGORIES,
          NOMINEES,
          VoteStorage,
          state,
          navigate,
        };
      })();
    </script>
  </body>
</html>
