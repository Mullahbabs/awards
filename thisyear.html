    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&display=swap"

    <script

      src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
    ></script>

    <style>
      /* ==========================================================================
   DESIGN TOKENS — brighter, image-forward
   ========================================================================== */
      :root {
        /* Brand blues */
        --brand-950: #0a1e4a;
        --brand-900: #0f2a6b;
        --brand-800: #153a94;
        --brand-700: #1d4ec4;
        --brand-600: #2b6fef;
        --brand-500: #4f8df7;
        --brand-400: #8ab4fa;
        --brand-300: #c5dafd;
        --brand-100: #eaf1fe;

        /* Amber / gold accent */
        --amber-700: #a86a0a;
        --amber-600: #d98a0f;
        --amber-500: #f5a524;
        --amber-400: #fbbf24;
        --amber-300: #fcd34d;
        --amber-100: #fef3c7;

        /* Coral supporting */
        --coral-600: #e11d48;
        --coral-500: #fb7185;
        --coral-400: #fda4af;
        --coral-100: #ffe4e6;

        /* Teal supporting */
        --teal-700: #0f766e;
        --teal-600: #0d9488;
        --teal-500: #14b8a6;
        --teal-400: #2dd4bf;
        --teal-100: #ccfbf1;

        /* Surfaces */
        --ivory-50: #fffcf6;
        --ivory-100: #fff9ec;
        --ivory-200: #f8efd9;
        --ivory-300: #efe0be;

        /* Ink */
        --ink-900: #0f172a;
        --ink-800: #1e293b;
        --ink-700: #334155;
        --ink-600: #475569;
        --ink-500: #64748b;
        --ink-400: #94a3b8;
        --ink-300: #cbd5e1;
        --ink-200: #e2e8f0;
        --ink-100: #f1f5f9;

        --bg-page: #fffcf6;
        --fg-primary: var(--ink-900);
        --fg-muted: var(--ink-500);
        --fg-on-dark: #fffcf6;
        --fg-on-dark-muted: rgba(255, 252, 246, 0.76);
        --border-light: rgba(15, 23, 42, 0.1);
        --border-dark: rgba(255, 252, 246, 0.16);

        --danger: #dc2626;
        --success: var(--teal-600);

        --font-display: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
        --font-sans:
          "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;

        --fs-display-xl: clamp(2.5rem, 6vw, 5.25rem);
        --fs-display-l: clamp(2rem, 4.6vw, 3.75rem);
        --fs-display-m: clamp(1.5rem, 3vw, 2.5rem);
        --fs-display-s: clamp(1.25rem, 2vw, 1.75rem);

        --lh-tight: 1.04;
        --lh-snug: 1.18;
        --lh-normal: 1.55;
        --lh-relaxed: 1.7;
        --ls-eyebrow: 0.18em;
        --ls-tight: -0.02em;
        --ls-tighter: -0.03em;

        --s-1: 4px;
        --s-2: 8px;
        --s-3: 12px;
        --s-4: 16px;
        --s-5: 20px;
        --s-6: 24px;
        --s-7: 32px;
        --s-8: 40px;
        --s-9: 48px;
        --s-10: 56px;
        --s-11: 64px;
        --s-12: 80px;
        --s-13: 96px;
        --s-14: 120px;

        --r-xs: 3px;
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 16px;
        --r-xl: 24px;
        --r-full: 999px;

        --sh-sm:
          0 1px 2px rgba(15, 23, 42, 0.06),
          0 4px 12px -4px rgba(15, 23, 42, 0.1);
        --sh-md:
          0 2px 4px rgba(15, 23, 42, 0.05),
          0 14px 36px -12px rgba(15, 23, 42, 0.18);
        --sh-lg:
          0 4px 10px rgba(15, 23, 42, 0.06),
          0 32px 64px -24px rgba(15, 23, 42, 0.26);
        --sh-xl:
          0 8px 20px rgba(15, 23, 42, 0.08),
          0 48px 96px -32px rgba(15, 23, 42, 0.34);
        --sh-amber: 0 12px 40px -12px rgba(245, 165, 36, 0.5);

        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-spring: cubic-bezier(0.34, 1.3, 0.64, 1);
        --dur-fast: 160ms;
        --dur-base: 280ms;
        --dur-slow: 520ms;
        --dur-reveal: 900ms;

        --shell-max: 1320px;
        --shell-pad: clamp(20px, 5vw, 56px);
        --header-h: 76px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      * {
        margin: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
      body {
        font-family: var(--font-sans);
        font-size: 1rem;
        line-height: var(--lh-normal);
        color: var(--fg-primary);
        background: var(--bg-page);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings:
          "kern" 1,
          "liga" 1,
          "cv11" 1;
        overflow-x: hidden;
      }
      body.no-scroll {
        overflow: hidden;
      }
      img,
      svg,
      video {
        display: block;
        max-width: 100%;
      }
      img {
        height: auto;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ul,
      ol {
        list-style: none;
        padding: 0;
      }
      h1,
      h2,
      h3,
      h4,
      h5 {
        font-weight: 400;
        line-height: var(--lh-snug);
        letter-spacing: var(--ls-tight);
      }
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid var(--amber-500);
        outline-offset: 3px;
        border-radius: var(--r-xs);
      }
      ::selection {
        background: var(--amber-400);
        color: var(--brand-950);
      }

      .skip-link {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 9999;
        padding: 12px 20px;
        background: var(--amber-500);
        color: var(--brand-950);
        font-weight: 600;
        font-size: 0.9375rem;
        border-radius: var(--r-sm);
        transform: translateY(-200%);
        transition: transform var(--dur-base) var(--ease-out);
      }
      .skip-link:focus {
        transform: translateY(0);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      /* LAYOUT */
      .shell {
        width: 100%;
        max-width: var(--shell-max);
        margin-inline: auto;
        padding-inline: var(--shell-pad);
      }
      .section {
        padding-block: clamp(64px, 10vw, 128px);
        position: relative;
      }
      .section--tight {
        padding-block: clamp(40px, 6vw, 80px);
      }

      /* TYPOGRAPHY */
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: var(--ls-eyebrow);
        text-transform: uppercase;
        color: var(--amber-600);
      }
      .eyebrow::before {
        content: "";
        width: 24px;
        height: 1px;
        background: currentColor;
        opacity: 0.6;
      }

      .display-xl {
        font-family: var(--font-display);
        font-size: var(--fs-display-xl);
        line-height: var(--lh-tight);
        letter-spacing: var(--ls-tighter);
        font-weight: 400;
      }
      .display-l {
        font-family: var(--font-display);
        font-size: var(--fs-display-l);
        line-height: 1.06;
        letter-spacing: var(--ls-tighter);
        font-weight: 400;
      }
      .display-m {
        font-family: var(--font-display);
        font-size: var(--fs-display-m);
        line-height: 1.12;
        letter-spacing: var(--ls-tight);
        font-weight: 400;
      }
      .display-s {
        font-family: var(--font-display);
        font-size: var(--fs-display-s);
        line-height: 1.2;
        letter-spacing: var(--ls-tight);
        font-weight: 500;
      }

      .lede {
        font-size: clamp(1.0625rem, 1.4vw, 1.1875rem);
        line-height: var(--lh-relaxed);
        color: var(--ink-600);
        max-width: 62ch;
      }
      .italic-accent {
        font-family: var(--font-display);
        font-style: italic;
        font-weight: 300;
        color: var(--amber-500);
      }

      .section-head {
        display: grid;
        gap: var(--s-5);
        margin-bottom: clamp(40px, 6vw, 72px);
        max-width: 820px;
      }
      .section-head--split {
        grid-template-columns: 1fr;
        max-width: none;
      }
      @media (min-width: 900px) {
        .section-head--split {
          grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
          align-items: end;
          gap: var(--s-10);
        }
      }
      .section-head__title {
        max-width: 20ch;
      }
      .section-head--split .section-head__title {
        max-width: 16ch;
      }
      .section-head__desc {
        max-width: 56ch;
        color: var(--ink-500);
        line-height: var(--lh-relaxed);
        font-size: 1.0625rem;
      }

      /* BUTTONS */
      .btn {
        --btn-bg: transparent;
        --btn-fg: var(--ink-900);
        --btn-border: transparent;
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 15px 28px;
        font-family: var(--font-sans);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--btn-fg);
        background: var(--btn-bg);
        border: 1px solid var(--btn-border);
        border-radius: var(--r-full);
        cursor: pointer;
        white-space: nowrap;
        transition:
          transform var(--dur-fast) var(--ease-out),
          background-color var(--dur-base) var(--ease-out),
          color var(--dur-base) var(--ease-out),
          border-color var(--dur-base) var(--ease-out),
          box-shadow var(--dur-base) var(--ease-out),
          opacity var(--dur-base) var(--ease-out);
        isolation: isolate;
      }
      .btn:hover {
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0) scale(0.985);
      }
      .btn:disabled,
      .btn[aria-disabled="true"] {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
        pointer-events: none;
      }
      .btn__icon {
        width: 16px;
        height: 16px;
        flex: none;
        transition: transform var(--dur-base) var(--ease-out);
      }
      .btn:hover .btn__icon--arrow {
        transform: translateX(3px);
      }

      .btn--primary {
        --btn-bg: var(--amber-500);
        --btn-fg: var(--brand-950);
        box-shadow: var(--sh-sm);
      }
      .btn--primary:hover {
        --btn-bg: var(--amber-400);
        box-shadow: var(--sh-amber);
      }

      .btn--brand {
        --btn-bg: var(--brand-700);
        --btn-fg: #fff;
        box-shadow: var(--sh-sm);
      }
      .btn--brand:hover {
        --btn-bg: var(--brand-600);
      }

      .btn--dark {
        --btn-bg: var(--ink-900);
        --btn-fg: var(--ivory-50);
      }
      .btn--dark:hover {
        --btn-bg: var(--ink-800);
      }

      .btn--outline {
        --btn-border: rgba(15, 23, 42, 0.22);
        --btn-fg: var(--ink-900);
      }
      .btn--outline:hover {
        --btn-bg: var(--ink-900);
        --btn-fg: var(--ivory-50);
        --btn-border: var(--ink-900);
      }

      .btn--ghost-light {
        --btn-fg: #fff;
        --btn-border: rgba(255, 255, 255, 0.4);
      }
      .btn--ghost-light:hover {
        --btn-bg: rgba(255, 255, 255, 0.14);
        --btn-border: #fff;
      }

      .btn--ghost {
        --btn-fg: var(--ink-700);
        padding: 10px 16px;
      }
      .btn--ghost:hover {
        --btn-bg: rgba(15, 23, 42, 0.06);
      }

      .btn--sm {
        padding: 11px 20px;
        font-size: 0.75rem;
      }
      .btn--lg {
        padding: 19px 38px;
        font-size: 0.9375rem;
      }
      .btn--block {
        width: 100%;
      }

      .link-underline {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding-bottom: 3px;
      }
      .link-underline::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 1px;
        background: currentColor;
        transform-origin: right;
        transition: transform var(--dur-base) var(--ease-out);
      }
      .link-underline:hover::after {
        transform-origin: left;
        transform: scaleX(0);
      }
      .link-underline svg {
        width: 14px;
        height: 14px;
        transition: transform var(--dur-base) var(--ease-out);
      }
      .link-underline:hover svg {
        transform: translateX(4px);
      }

      /* IMAGE HELPER — background-image with graceful gradient fallback */
      .img-cover {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        background-color: var(--brand-800);
      }
      .img-cover--hero-1 {
        background-image:
          linear-gradient(
            135deg,
            rgba(10, 30, 74, 0.72) 0%,
            rgba(21, 58, 148, 0.48) 55%,
            rgba(43, 111, 239, 0.38) 100%
          ),
          url("./img/awards.jpg"),
          linear-gradient(160deg, #2b6fef 0%, #153a94 55%, #0a1e4a 100%);
      }
      .img-cover--hero-2 {
        background-image:
          linear-gradient(
            135deg,
            rgba(10, 30, 74, 0.62) 0%,
            rgba(29, 78, 196, 0.42) 50%,
            rgba(245, 165, 36, 0.32) 100%
          ),
          url("./img/awards2.jpg"),
          linear-gradient(200deg, #1d4ec4 0%, #153a94 50%, #f5a524 100%);
      }
      .img-cover--hero-3 {
        background-image:
          linear-gradient(
            135deg,
            rgba(10, 30, 74, 0.62) 0%,
            rgba(13, 148, 136, 0.48) 55%,
            rgba(21, 58, 148, 0.42) 100%
          ),
          url("./img/awards3.jpg"),
          linear-gradient(140deg, #0f766e 0%, #153a94 55%, #0a1e4a 100%);
      }
      .img-cover--about {
        background-image:
          linear-gradient(
            160deg,
            rgba(10, 30, 74, 0.42) 0%,
            rgba(29, 78, 196, 0.3) 100%
          ),
          url("./img/about.jpg"),
          linear-gradient(150deg, #1d4ec4 0%, #153a94 60%, #0a1e4a 100%);
      }
      .img-cover--event {
        background-image:
          linear-gradient(
            180deg,
            rgba(10, 30, 74, 0.82) 0%,
            rgba(15, 42, 107, 0.72) 100%
          ),
          url("./img/event.jpg"),
          linear-gradient(180deg, #0f2a6b 0%, #0a1e4a 100%);
      }
      .img-cover--vote-cta {
        background-image:
          linear-gradient(
            135deg,
            rgba(10, 30, 74, 0.72) 0%,
            rgba(29, 78, 196, 0.52) 50%,
            rgba(245, 165, 36, 0.38) 100%
          ),
          url("./img/vote-cta.jpg"),
          linear-gradient(135deg, #153a94 0%, #1d4ec4 55%, #f5a524 100%);
      }
      .img-cover--final-cta {
        background-image:
          linear-gradient(
            135deg,
            rgba(10, 30, 74, 0.72) 0%,
            rgba(29, 78, 196, 0.52) 100%
          ),
          url("./img/final-cta.jpg"),
          linear-gradient(135deg, #1d4ec4 0%, #0a1e4a 100%);
      }
      .img-cover--page-head {
        background-image:
          linear-gradient(
            135deg,
            rgba(10, 30, 74, 0.72) 0%,
            rgba(29, 78, 196, 0.5) 100%
          ),
          url("./img/page-head.jpg"),
          linear-gradient(160deg, #1d4ec4 0%, #0a1e4a 100%);
      }
      .img-cover--success {
        background-image:
          linear-gradient(
            135deg,
            rgba(10, 30, 74, 0.78) 0%,
            rgba(13, 148, 136, 0.5) 100%
          ),
          url("./img/success.jpg"),
          linear-gradient(160deg, #153a94 0%, #0f766e 100%);
      }
      .img-cover--gallery-1 {
        background-image:
          url("./img/gallery/g1.jpg"),
          linear-gradient(140deg, #1d4ec4, #0a1e4a 55%, #0f766e);
      }
      .img-cover--gallery-2 {
        background-image:
          url("./img/gallery/g2.jpg"),
          linear-gradient(200deg, #2b6fef, #153a94 60%, #0a1e4a);
      }
      .img-cover--gallery-3 {
        background-image:
          url("./img/gallery/g3.jpg"),
          linear-gradient(120deg, #0f766e, #153a94 50%, #1d4ec4);
      }
      .img-cover--gallery-4 {
        background-image:
          url("./img/gallery/g4.jpg"),
          linear-gradient(170deg, #f5a524, #153a94 60%, #0a1e4a);
      }
      .img-cover--gallery-5 {
        background-image:
          url("./img/gallery/g5.jpg"),
          linear-gradient(150deg, #153a94, #1d4ec4 45%, #0f766e);
      }
      .img-cover--gallery-6 {
        background-image:
          url("./img/gallery/g6.jpg"),
          linear-gradient(140deg, #fb7185, #1d4ec4 55%, #0a1e4a);
      }
      .img-cover--gallery-7 {
        background-image:
          url("./img/gallery/g7.jpg"),
          linear-gradient(200deg, #0f2a6b, #2b6fef 55%, #f5a524);
      }

      /* Optional darkening overlay */
      .img-cover::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 30%,
          transparent 30%,
          rgba(10, 30, 74, 0.35) 100%
        );
        pointer-events: none;
      }

      /* HEADER */
      .site-header {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 100;
        height: var(--header-h);
        display: flex;
        align-items: center;
        transition:
          background-color var(--dur-slow) var(--ease-out),
          height var(--dur-slow) var(--ease-out),
          border-color var(--dur-slow) var(--ease-out),
          backdrop-filter var(--dur-slow) var(--ease-out);
        border-bottom: 1px solid transparent;
      }
      .site-header__inner {
        width: 100%;
        max-width: var(--shell-max);
        margin-inline: auto;
        padding-inline: var(--shell-pad);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-6);
      }
      .site-header--transparent {
        color: #fff;
      }
      .site-header--transparent .brand__mark {
        color: var(--amber-400);
      }
      .site-header--transparent .nav__link {
        color: rgba(255, 255, 255, 0.88);
      }
      .site-header--transparent .nav__link:hover {
        color: #fff;
      }
      .site-header--solid {
        background: rgba(255, 252, 246, 0.94);
        backdrop-filter: saturate(180%) blur(18px);
        -webkit-backdrop-filter: saturate(180%) blur(18px);
        border-bottom-color: var(--border-light);
        height: 66px;
        color: var(--ink-900);
      }
      .site-header--solid .brand__mark {
        color: var(--amber-600);
      }
      .site-header--solid .nav__link {
        color: var(--ink-600);
      }
      .site-header--solid .nav__link:hover {
        color: var(--ink-900);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
      }
      .brand__mark {
        width: 34px;
        height: 34px;
        flex: none;
        transition: color var(--dur-slow) var(--ease-out);
      }
      .brand__text {
        display: flex;
        flex-direction: column;
        line-height: 1;
      }
      .brand__name {
        font-family: var(--font-display);
        font-size: 1.0625rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .brand__sub {
        font-size: 0.5625rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.72;
        margin-top: 3px;
      }

      .nav {
        display: none;
        align-items: center;
        gap: 2px;
      }
      @media (min-width: 1080px) {
        .nav {
          display: flex;
        }
      }
      .nav__link {
        position: relative;
        padding: 8px 14px;
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        border-radius: var(--r-full);
        transition:
          color var(--dur-base) var(--ease-out),
          background-color var(--dur-base) var(--ease-out);
      }
      .site-header--solid .nav__link:hover {
        background: rgba(15, 23, 42, 0.06);
      }
      .site-header--transparent .nav__link:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .nav__link[aria-current="page"] {
        color: var(--amber-600);
      }
      .site-header--transparent .nav__link[aria-current="page"] {
        color: var(--amber-400);
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: var(--s-3);
      }
      .header-actions .btn--vote {
        padding: 11px 22px;
        font-size: 0.75rem;
      }
      @media (max-width: 420px) {
        .header-actions .btn--vote {
          display: none;
        }
      }

      .menu-toggle {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        margin-right: -8px;
        border-radius: var(--r-full);
        transition: background-color var(--dur-base) var(--ease-out);
      }
      @media (min-width: 1080px) {
        .menu-toggle {
          display: none;
        }
      }
      .menu-toggle:hover {
        background: rgba(128, 128, 128, 0.16);
      }
      .menu-toggle__box {
        position: relative;
        width: 20px;
        height: 12px;
      }
      .menu-toggle__bar {
        position: absolute;
        left: 0;
        width: 100%;
        height: 1.5px;
        background: currentColor;
        border-radius: 2px;
        transition:
          transform var(--dur-base) var(--ease-out),
          opacity var(--dur-fast) var(--ease-out);
      }
      .menu-toggle__bar:nth-child(1) {
        top: 0;
      }
      .menu-toggle__bar:nth-child(2) {
        top: 5.25px;
      }
      .menu-toggle__bar:nth-child(3) {
        top: 10.5px;
      }
      .menu-toggle[aria-expanded="true"] .menu-toggle__bar:nth-child(1) {
        transform: translateY(5.25px) rotate(45deg);
      }
      .menu-toggle[aria-expanded="true"] .menu-toggle__bar:nth-child(2) {
        opacity: 0;
      }
      .menu-toggle[aria-expanded="true"] .menu-toggle__bar:nth-child(3) {
        transform: translateY(-5.25px) rotate(-45deg);
      }

      .drawer-scrim {
        position: fixed;
        inset: 0;
        z-index: 98;
        background: rgba(10, 30, 74, 0.62);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity var(--dur-base) var(--ease-out),
          visibility var(--dur-base);
      }
      .drawer-scrim[data-open="true"] {
        opacity: 1;
        visibility: visible;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 99;
        width: min(400px, 88vw);
        background: var(--brand-900);
        color: var(--fg-on-dark);
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform var(--dur-slow) var(--ease-out);
        overflow-y: auto;
        overscroll-behavior: contain;
        border-left: 1px solid var(--border-dark);
      }
      .drawer[data-open="true"] {
        transform: translateX(0);
      }
      @media (min-width: 1080px) {
        .drawer,
        .drawer-scrim {
          display: none;
        }
      }
      .drawer__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--s-5) var(--s-6);
        min-height: var(--header-h);
        border-bottom: 1px solid var(--border-dark);
        flex: none;
      }
      .drawer__close {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin-right: -8px;
        border-radius: var(--r-full);
        color: var(--fg-on-dark);
      }
      .drawer__close:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .drawer__nav {
        padding: var(--s-6);
        flex: 1;
      }
      .drawer__link {
        display: flex;
        align-items: baseline;
        gap: var(--s-4);
        padding: var(--s-4) 0;
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        border-bottom: 1px solid var(--border-dark);
        transition:
          color var(--dur-base) var(--ease-out),
          padding-left var(--dur-base) var(--ease-out);
      }
      .drawer__link:hover,
      .drawer__link[aria-current="page"] {
        color: var(--amber-400);
        padding-left: 6px;
      }
      .drawer__link span {
        font-family: var(--font-sans);
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--amber-500);
        opacity: 0.9;
      }
      .drawer__foot {
        padding: var(--s-6);
        border-top: 1px solid var(--border-dark);
        flex: none;
      }

      /* HERO */
      .hero {
        position: relative;
        min-height: min(100svh, 940px);
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        isolation: isolate;
        padding-top: calc(var(--header-h) + 40px);
        padding-bottom: clamp(32px, 5vw, 64px);
        background: var(--brand-900);
      }
      .hero__slides {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .hero__slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 1100ms var(--ease-in-out),
          visibility 1100ms;
      }
      .hero__slide[data-active="true"] {
        opacity: 1;
        visibility: visible;
      }
      .hero__slide-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        transform: scale(1.06);
        transition: transform 9s linear;
      }
      .hero__slide[data-active="true"] .hero__slide-bg {
        transform: scale(1);
      }
      @media (prefers-reduced-motion: reduce) {
        .hero__slide-bg {
          transition: none !important;
          transform: none !important;
        }
      }

      .hero__overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(10, 30, 74, 0.55) 0%,
          rgba(10, 30, 74, 0.2) 40%,
          rgba(10, 30, 74, 0.85) 100%
        );
      }

      .hero__inner {
        position: relative;
        z-index: 3;
        width: 100%;
        max-width: var(--shell-max);
        margin-inline: auto;
        padding-inline: var(--shell-pad);
        display: grid;
        gap: clamp(32px, 5vw, 64px);
        align-items: end;
      }
      @media (min-width: 1000px) {
        .hero__inner {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: var(--s-12);
        }
      }
      .hero__content {
        max-width: 780px;
      }
      .hero__eyebrow {
        margin-bottom: var(--s-6);
        color: var(--amber-400);
      }
      .hero__eyebrow::before {
        background: var(--amber-400);
      }
      .hero__title {
        font-family: var(--font-display);
        font-size: var(--fs-display-xl);
        line-height: 0.98;
        letter-spacing: var(--ls-tighter);
        font-weight: 400;
        margin-bottom: var(--s-6);
        text-wrap: balance;
        text-shadow: 0 2px 24px rgba(10, 30, 74, 0.5);
      }
      .hero__title em {
        font-style: italic;
        font-weight: 300;
        color: var(--amber-400);
      }
      .hero__copy {
        font-size: clamp(1rem, 1.25vw, 1.125rem);
        line-height: 1.72;
        color: rgba(255, 255, 255, 0.88);
        max-width: 56ch;
        margin-bottom: var(--s-8);
        text-shadow: 0 1px 12px rgba(10, 30, 74, 0.5);
      }
      .hero__ctas {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-3);
      }
      .hero__meta {
        display: grid;
        gap: var(--s-5);
        padding: var(--s-6);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: var(--r-lg);
        background: rgba(10, 30, 74, 0.48);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        min-width: 280px;
      }
      @media (max-width: 999px) {
        .hero__meta {
          display: none;
        }
      }
      .hero__meta-row {
        display: flex;
        gap: var(--s-4);
        align-items: flex-start;
      }
      .hero__meta-icon {
        width: 34px;
        height: 34px;
        flex: none;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: var(--r-full);
        color: var(--amber-400);
      }
      .hero__meta-icon svg {
        width: 15px;
        height: 15px;
      }
      .hero__meta-label {
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 3px;
      }
      .hero__meta-value {
        font-size: 0.9375rem;
        font-weight: 500;
        line-height: 1.35;
        color: #fff;
      }
      .hero__controls {
        position: relative;
        z-index: 3;
        width: 100%;
        max-width: var(--shell-max);
        margin: clamp(32px, 4vw, 56px) auto 0;
        padding-inline: var(--shell-pad);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-6);
      }
      .hero__indicators {
        display: flex;
        gap: var(--s-3);
        align-items: center;
      }
      .hero__dot {
        position: relative;
        width: 44px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.28);
        overflow: hidden;
        transition: background-color var(--dur-base) var(--ease-out);
      }
      .hero__dot::after {
        content: "";
        position: absolute;
        inset: 0;
        transform-origin: left;
        background: var(--amber-400);
        transform: scaleX(0);
      }
      .hero__dot[aria-selected="true"]::after {
        transform: scaleX(1);
        transition: transform 7s linear;
      }
      .hero__dot:hover {
        background: rgba(255, 255, 255, 0.5);
      }
      .hero__arrows {
        display: flex;
        gap: var(--s-2);
      }
      .hero__arrow {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: var(--r-full);
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: #fff;
        transition:
          background-color var(--dur-base) var(--ease-out),
          border-color var(--dur-base) var(--ease-out),
          transform var(--dur-fast) var(--ease-out);
      }
      .hero__arrow:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: #fff;
      }
      .hero__arrow:active {
        transform: scale(0.94);
      }
      .hero__arrow svg {
        width: 16px;
        height: 16px;
      }

      /* SEARCH STRIP — homepage quick search */
      .search-strip {
        background: var(--brand-900);
        color: #fff;
        padding-block: clamp(32px, 4vw, 48px);
        border-top: 1px solid var(--border-dark);
      }
      .search-strip__inner {
        display: grid;
        gap: var(--s-5);
      }
      @media (min-width: 820px) {
        .search-strip__inner {
          grid-template-columns: 1fr auto;
          align-items: center;
          gap: var(--s-8);
        }
      }
      .search-strip__title {
        font-family: var(--font-display);
        font-size: clamp(1.25rem, 2vw, 1.625rem);
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      .search-strip__sub {
        font-size: 0.875rem;
        color: var(--fg-on-dark-muted);
        margin-top: 4px;
      }
      .quick-search {
        position: relative;
        min-width: 0;
        width: 100%;
      }
      @media (min-width: 820px) {
        .quick-search {
          width: min(520px, 100%);
        }
      }
      .quick-search__field {
        position: relative;
      }
      .quick-search__field svg {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        color: var(--ink-400);
        pointer-events: none;
      }
      .quick-search input {
        width: 100%;
        padding: 18px 22px 18px 52px;
        background: var(--ivory-50);
        border: 2px solid transparent;
        border-radius: var(--r-full);
        font-size: 1rem;
        color: var(--ink-900);
        font-family: var(--font-sans);
        transition:
          border-color var(--dur-base) var(--ease-out),
          box-shadow var(--dur-base) var(--ease-out);
      }
      .quick-search input::placeholder {
        color: var(--ink-400);
      }
      .quick-search input:focus {
        border-color: var(--amber-500);
        box-shadow: 0 0 0 4px rgba(245, 165, 36, 0.22);
      }
      .quick-search__results {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        z-index: 30;
        background: #fff;
        border-radius: var(--r-lg);
        box-shadow: var(--sh-xl);
        overflow: hidden;
        max-height: min(60vh, 520px);
        overflow-y: auto;
        color: var(--ink-900);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-6px);
        transition:
          opacity var(--dur-base) var(--ease-out),
          visibility var(--dur-base),
          transform var(--dur-base) var(--ease-out);
      }
      .quick-search__results[data-open="true"] {
        opacity: 1;
        visibility: visible;
        transform: none;
      }
      .qs-item {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: var(--s-4);
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-light);
        cursor: pointer;
        transition: background-color var(--dur-fast) var(--ease-out);
      }
      .qs-item:hover,
      .qs-item[data-focused="true"] {
        background: var(--ivory-100);
      }
      .qs-item:last-child {
        border-bottom: 0;
      }
      .qs-item__thumb {
        width: 56px;
        height: 56px;
        border-radius: var(--r-md);
        overflow: hidden;
        position: relative;
        background: var(--brand-800);
        flex: none;
      }
      .qs-item__thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .qs-item__info {
        min-width: 0;
      }
      .qs-item__name {
        font-family: var(--font-display);
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qs-item__meta {
        font-size: 0.75rem;
        color: var(--ink-500);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qs-item__cta {
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brand-700);
        padding: 8px 14px;
        border-radius: var(--r-full);
        border: 1px solid var(--brand-300);
        background: var(--brand-100);
        white-space: nowrap;
        transition: all var(--dur-base) var(--ease-out);
      }
      .qs-item:hover .qs-item__cta {
        background: var(--brand-700);
        border-color: var(--brand-700);
        color: #fff;
      }
      .qs-empty {
        padding: 28px 20px;
        text-align: center;
        color: var(--ink-500);
        font-size: 0.9375rem;
      }

      /* TRUST STRIP */
      .trust {
        background: var(--brand-900);
        color: #fff;
        border-top: 1px solid var(--border-dark);
        padding-block: clamp(40px, 5vw, 64px);
        position: relative;
        isolation: isolate;
      }
      .trust__grid {
        display: grid;
        gap: var(--s-8) var(--s-6);
        grid-template-columns: repeat(2, 1fr);
      }
      @media (min-width: 760px) {
        .trust__grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 1020px) {
        .trust__grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }
      .trust__item {
        display: flex;
        flex-direction: column;
        gap: var(--s-2);
      }
      .trust__num {
        font-family: var(--font-display);
        font-size: clamp(2rem, 3.4vw, 2.875rem);
        line-height: 1;
        letter-spacing: var(--ls-tighter);
        color: #fff;
        display: flex;
        align-items: baseline;
        gap: 2px;
      }
      .trust__num sup {
        font-size: 0.5em;
        color: var(--amber-400);
        top: -0.7em;
        position: relative;
      }
      .trust__label {
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-on-dark-muted);
      }

      /* ABOUT */
      .about__grid {
        display: grid;
        gap: clamp(40px, 6vw, 88px);
        align-items: center;
      }
      @media (min-width: 960px) {
        .about__grid {
          grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
        }
      }
      .about__visual {
        position: relative;
      }
      .about__frame {
        position: relative;
        aspect-ratio: 4/5;
        border-radius: var(--r-lg);
        overflow: hidden;
        box-shadow: var(--sh-lg);
      }
      .about__frame-content {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(24px, 3vw, 40px);
        color: #fff;
      }
      .about__frame-quote {
        font-family: var(--font-display);
        font-size: clamp(1.375rem, 2.2vw, 1.75rem);
        line-height: 1.3;
        font-style: italic;
        font-weight: 300;
        letter-spacing: -0.01em;
        max-width: 22ch;
        text-shadow: 0 2px 16px rgba(10, 30, 74, 0.5);
      }
      .about__frame-quote::before {
        content: "\201C";
        color: var(--amber-400);
        font-size: 1.4em;
        line-height: 0;
        vertical-align: -0.35em;
        margin-right: 2px;
      }
      .about__frame-foot {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        padding-top: var(--s-5);
        border-top: 1px solid rgba(255, 255, 255, 0.28);
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.86);
      }
      .about__frame-foot svg {
        width: 16px;
        height: 16px;
        color: var(--amber-400);
      }
      .about__badge {
        position: absolute;
        right: -14px;
        bottom: 32px;
        z-index: 3;
        display: grid;
        gap: 2px;
        padding: var(--s-5) var(--s-6);
        background: var(--amber-500);
        color: var(--brand-950);
        border-radius: var(--r-md);
        box-shadow: var(--sh-lg);
      }
      @media (max-width: 520px) {
        .about__badge {
          right: 12px;
          bottom: 12px;
          padding: var(--s-4);
        }
      }
      .about__badge-num {
        font-family: var(--font-display);
        font-size: 1.75rem;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .about__badge-label {
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .about__pillars {
        display: grid;
        gap: 0;
        margin-top: var(--s-9);
        border-top: 1px solid var(--border-light);
      }
      .about__pillar {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--s-5);
        padding-block: var(--s-5);
        border-bottom: 1px solid var(--border-light);
      }
      .about__pillar-icon {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: var(--r-full);
        background: var(--amber-100);
        color: var(--amber-700);
      }
      .about__pillar-icon svg {
        width: 17px;
        height: 17px;
      }
      .about__pillar-title {
        font-size: 0.9375rem;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .about__pillar-desc {
        font-size: 0.875rem;
        color: var(--ink-500);
        line-height: 1.6;
      }

      /* CATEGORIES */
      .cat-grid {
        display: grid;
        gap: clamp(16px, 2vw, 24px);
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
      }
      .cat-card {
        position: relative;
        display: flex;
        flex-direction: column;
        border-radius: var(--r-lg);
        overflow: hidden;
        background: var(--ivory-50);
        border: 1px solid var(--border-light);
        transition:
          transform var(--dur-slow) var(--ease-out),
          box-shadow var(--dur-slow) var(--ease-out);
      }
      .cat-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--sh-lg);
      }
      .cat-card__media {
        position: relative;
        aspect-ratio: 16/10;
        overflow: hidden;
        background: var(--brand-800);
      }
      .cat-card__media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 900ms var(--ease-out);
      }
      .cat-card:hover .cat-card__media img {
        transform: scale(1.06);
      }
      .cat-card__media::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(10, 30, 74, 0.1) 0%,
          rgba(10, 30, 74, 0.72) 100%
        );
      }
      .cat-card__media-content {
        position: absolute;
        inset: auto 0 0 0;
        z-index: 2;
        padding: var(--s-5);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: var(--s-3);
      }
      .cat-card__icon {
        width: 42px;
        height: 42px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: var(--r-md);
        background: var(--amber-500);
        color: var(--brand-950);
        box-shadow: var(--sh-sm);
      }
      .cat-card__icon svg {
        width: 20px;
        height: 20px;
      }
      .cat-card__idx {
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        font-weight: 700;
        color: #fff;
        letter-spacing: 0.06em;
        text-shadow: 0 1px 8px rgba(10, 30, 74, 0.6);
      }
      .cat-card__body {
        padding: var(--s-5);
        display: grid;
        gap: var(--s-3);
        flex: 1;
      }
      .cat-card__name {
        font-family: var(--font-display);
        font-size: 1.25rem;
        line-height: 1.18;
        letter-spacing: -0.02em;
        font-weight: 500;
        text-wrap: balance;
      }
      .cat-card__desc {
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--ink-500);
        flex: 1;
      }
      .cat-card__foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s-4);
        padding-top: var(--s-4);
        border-top: 1px solid var(--border-light);
      }
      .cat-card__count {
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-500);
      }
      .cat-card__cta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--brand-700);
      }
      .cat-card__cta svg {
        width: 13px;
        height: 13px;
        transition: transform var(--dur-base) var(--ease-out);
      }
      .cat-card:hover .cat-card__cta svg {
        transform: translateX(4px);
      }

      /* NOMINEE CARDS */
      .nom-grid {
        display: grid;
        gap: clamp(18px, 2vw, 26px);
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
      }
      .nom-card {
        display: flex;
        flex-direction: column;
        background: var(--ivory-50);
        border: 1px solid var(--border-light);
        border-radius: var(--r-lg);
        overflow: hidden;
        transition:
          transform var(--dur-slow) var(--ease-out),
          box-shadow var(--dur-slow) var(--ease-out);
      }
      .nom-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--sh-md);
      }
      .nom-card__media {
        position: relative;
        aspect-ratio: 16/11;
        overflow: hidden;
        background: var(--brand-800);
        display: block;
      }
      .nom-card__media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 900ms var(--ease-out);
      }
      .nom-card:hover .nom-card__media img {
        transform: scale(1.05);
      }
      .nom-card__media::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(10, 30, 74, 0.1) 0%,
          rgba(10, 30, 74, 0.5) 100%
        );
      }
      .nom-card__cat-tag {
        position: absolute;
        z-index: 2;
        left: 14px;
        top: 14px;
        padding: 6px 12px;
        border-radius: var(--r-full);
        background: rgba(10, 30, 74, 0.68);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--amber-300);
        border: 1px solid rgba(245, 165, 36, 0.4);
      }
      .nom-card__voted-tag {
        position: absolute;
        z-index: 2;
        right: 14px;
        top: 14px;
        padding: 6px 12px;
        border-radius: var(--r-full);
        background: var(--teal-600);
        color: #fff;
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        box-shadow: var(--sh-sm);
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .nom-card__voted-tag svg {
        width: 11px;
        height: 11px;
      }
      .nom-card__body {
        display: flex;
        flex-direction: column;
        gap: var(--s-3);
        padding: var(--s-5);
        flex: 1;
      }
      .nom-card__name {
        font-family: var(--font-display);
        font-size: 1.1875rem;
        line-height: 1.22;
        letter-spacing: -0.015em;
        font-weight: 500;
      }
      .nom-card__loc {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        color: var(--ink-500);
        font-weight: 500;
      }
      .nom-card__loc svg {
        width: 12px;
        height: 12px;
      }
      .nom-card__desc {
        font-size: 0.8125rem;
        line-height: 1.6;
        color: var(--ink-500);
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .nom-card__progress {
        display: grid;
        gap: 6px;
        padding-top: var(--s-2);
      }
      .nom-card__progress-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--s-3);
      }
      .nom-card__progress-label {
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-500);
      }
      .nom-card__progress-pct {
        font-family: var(--font-display);
        font-size: 0.9375rem;
        font-weight: 500;
        color: var(--ink-900);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }
      .nom-card__progress-track {
        height: 6px;
        border-radius: 3px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .nom-card__progress-fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--brand-700), var(--amber-500));
        transform-origin: left;
        transition: transform var(--dur-slow) var(--ease-out);
      }

      .nom-card__actions {
        display: flex;
        gap: var(--s-2);
        padding: var(--s-4) var(--s-5);
        border-top: 1px solid var(--border-light);
        background: var(--ivory-100);
      }
      .nom-card__actions .btn {
        flex: 1;
      }

      /* VOTE CTA */
      .vote-cta {
        position: relative;
        isolation: isolate;
        color: #fff;
        overflow: hidden;
      }
      .vote-cta__grid {
        display: grid;
        gap: clamp(36px, 5vw, 72px);
        align-items: center;
      }
      @media (min-width: 900px) {
        .vote-cta__grid {
          grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
        }
      }
      .vote-cta__steps {
        display: grid;
        gap: var(--s-5);
        counter-reset: step;
      }
      .vote-cta__step {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--s-5);
        padding-bottom: var(--s-5);
        border-bottom: 1px solid rgba(255, 255, 255, 0.22);
      }
      .vote-cta__step:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .vote-cta__step-num {
        counter-increment: step;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: var(--r-full);
        border: 1px solid rgba(245, 165, 36, 0.6);
        color: var(--amber-400);
        font-family: var(--font-display);
        font-size: 0.9375rem;
      }
      .vote-cta__step-num::before {
        content: counter(step, decimal-leading-zero);
      }
      .vote-cta__step-title {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 3px;
        color: #fff;
      }
      .vote-cta__step-desc {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.82);
        line-height: 1.6;
      }

      /* SCHEDULE / EVENT */
      .schedule {
        position: relative;
        isolation: isolate;
        color: #fff;
        overflow: hidden;
      }
      .schedule__list {
        display: grid;
        gap: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }
      .schedule__item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: var(--s-5);
        align-items: center;
        padding: var(--s-5) 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      }
      @media (max-width: 640px) {
        .schedule__item {
          grid-template-columns: auto 1fr;
          row-gap: var(--s-2);
        }
        .schedule__item-date {
          grid-column: 2;
          font-size: 0.8125rem !important;
        }
      }
      .schedule__item-dot {
        width: 14px;
        height: 14px;
        border-radius: var(--r-full);
        flex: none;
        background: var(--amber-400);
        box-shadow: 0 0 0 5px rgba(245, 165, 36, 0.22);
      }
      .schedule__item-dot--upcoming {
        background: rgba(255, 255, 255, 0.35);
        box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.08);
      }
      .schedule__item-label {
        font-family: var(--font-display);
        font-size: clamp(1.0625rem, 1.6vw, 1.375rem);
        letter-spacing: -0.015em;
        color: #fff;
        line-height: 1.25;
      }
      .schedule__item-date {
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.86);
        white-space: nowrap;
      }
      .schedule__item--highlight .schedule__item-label {
        color: var(--amber-300);
      }
      .schedule__item--highlight .schedule__item-dot {
        background: var(--coral-500);
        box-shadow: 0 0 0 5px rgba(251, 113, 133, 0.28);
      }

      .cd-grid {
        display: grid;
        gap: clamp(20px, 3vw, 44px);
        grid-template-columns: repeat(2, 1fr);
        justify-items: center;
        max-width: 760px;
        margin-inline: auto;
        margin-top: clamp(48px, 6vw, 80px);
      }
      @media (min-width: 640px) {
        .cd-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      .cd-unit {
        display: grid;
        justify-items: center;
        gap: var(--s-3);
      }
      .cd-ring {
        position: relative;
        width: clamp(92px, 13vw, 132px);
        aspect-ratio: 1;
      }
      .cd-ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .cd-ring__track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.2);
        stroke-width: 2;
      }
      .cd-ring__fill {
        fill: none;
        stroke: var(--amber-400);
        stroke-width: 2;
        stroke-linecap: round;
        transition: stroke-dashoffset 900ms var(--ease-out);
      }
      .cd-ring__value {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 3.6vw, 2.5rem);
        line-height: 1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: #fff;
      }
      .cd-unit__label {
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.76);
      }

      .event-card {
        margin-top: clamp(48px, 6vw, 80px);
        display: grid;
        gap: 0;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: var(--r-lg);
        overflow: hidden;
        background: rgba(10, 30, 74, 0.5);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      @media (min-width: 860px) {
        .event-card {
          grid-template-columns: 1.4fr 1fr;
        }
      }
      .event-card__main {
        padding: clamp(28px, 4vw, 48px);
        display: grid;
        gap: var(--s-6);
        align-content: start;
      }
      .event-card__side {
        padding: clamp(28px, 4vw, 48px);
        background: rgba(255, 255, 255, 0.05);
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        display: grid;
        gap: var(--s-5);
        align-content: start;
      }
      @media (min-width: 860px) {
        .event-card__side {
          border-top: 0;
          border-left: 1px solid rgba(255, 255, 255, 0.2);
        }
      }
      .event-card__date {
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 3.4vw, 2.5rem);
        line-height: 1.1;
        letter-spacing: -0.025em;
        color: #fff;
      }
      .event-card__rows {
        display: grid;
        gap: var(--s-4);
      }
      .event-card__row {
        display: flex;
        gap: var(--s-4);
        align-items: flex-start;
        font-size: 0.9375rem;
        color: #fff;
      }
      .event-card__row svg {
        width: 16px;
        height: 16px;
        color: var(--amber-400);
        flex: none;
        margin-top: 3px;
      }
      .event-card__row dt {
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
        margin-bottom: 3px;
      }
      .event-card__calendar-actions {
        display: grid;
        gap: var(--s-2);
      }

      /* GALLERY */
      .gallery {
        display: grid;
        gap: clamp(12px, 1.6vw, 20px);
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: minmax(140px, auto);
      }
      @media (min-width: 860px) {
        .gallery {
          grid-template-columns: repeat(4, 1fr);
          grid-auto-rows: minmax(180px, 1fr);
        }
        .g-item--feature {
          grid-column: span 2;
          grid-row: span 2;
        }
        .g-item--tall {
          grid-row: span 2;
        }
        .g-item--wide {
          grid-column: span 2;
        }
      }
      .g-item {
        position: relative;
        overflow: hidden;
        border-radius: var(--r-md);
        background: var(--brand-800);
        cursor: zoom-in;
        text-align: left;
        padding: 0;
        border: 0;
        display: block;
        width: 100%;
        height: 100%;
        transition: box-shadow var(--dur-slow) var(--ease-out);
      }
      .g-item:hover {
        box-shadow: var(--sh-md);
      }
      .g-item__media {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        transition: transform 900ms var(--ease-out);
      }
      .g-item:hover .g-item__media {
        transform: scale(1.06);
      }
      .g-item__overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
          180deg,
          transparent 40%,
          rgba(10, 30, 74, 0.88)
        );
        opacity: 0;
        transition: opacity var(--dur-slow) var(--ease-out);
        display: flex;
        align-items: flex-end;
        padding: var(--s-5);
      }
      .g-item:hover .g-item__overlay,
      .g-item:focus-visible .g-item__overlay {
        opacity: 1;
      }
      .g-item__caption {
        color: #fff;
        font-size: 0.8125rem;
        line-height: 1.45;
        font-weight: 500;
        transform: translateY(8px);
        transition: transform var(--dur-slow) var(--ease-out);
      }
      .g-item:hover .g-item__caption {
        transform: translateY(0);
      }
      .g-item__badge {
        position: absolute;
        z-index: 2;
        top: 14px;
        right: 14px;
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: var(--r-full);
        background: rgba(10, 30, 74, 0.6);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #fff;
        opacity: 0;
        transform: scale(0.85);
        transition:
          opacity var(--dur-base) var(--ease-out),
          transform var(--dur-base) var(--ease-out);
      }
      .g-item:hover .g-item__badge,
      .g-item:focus-visible .g-item__badge {
        opacity: 1;
        transform: scale(1);
      }
      .g-item__badge svg {
        width: 14px;
        height: 14px;
      }

      /* SPONSORS */
      .sponsor-tier {
        margin-bottom: var(--s-10);
      }
      .sponsor-tier:last-child {
        margin-bottom: 0;
      }
      .sponsor-tier__label {
        display: flex;
        align-items: center;
        gap: var(--s-4);
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-500);
        margin-bottom: var(--s-6);
      }
      .sponsor-tier__label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-light);
      }
      .sponsor-tier--principal .sponsor-tier__label {
        color: var(--amber-600);
      }
      .sponsor-grid {
        display: grid;
        gap: 1px;
        background: var(--border-light);
        border: 1px solid var(--border-light);
        border-radius: var(--r-md);
        overflow: hidden;
      }
      .sponsor-tier--principal .sponsor-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .sponsor-tier--partner .sponsor-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .sponsor-tier--supporter .sponsor-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      @media (min-width: 700px) {
        .sponsor-tier--principal .sponsor-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .sponsor-tier--partner .sponsor-grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .sponsor-tier--supporter .sponsor-grid {
          grid-template-columns: repeat(6, 1fr);
        }
      }
      .sponsor-cell {
        display: grid;
        place-items: center;
        padding: clamp(22px, 3vw, 38px) var(--s-5);
        background: var(--ivory-50);
        min-height: 96px;
        transition: background-color var(--dur-base) var(--ease-out);
      }
      .sponsor-cell:hover {
        background: var(--ivory-100);
      }
      .sponsor-cell__name {
        font-family: var(--font-display);
        font-size: clamp(0.9375rem, 1.4vw, 1.125rem);
        letter-spacing: -0.01em;
        color: var(--ink-600);
        text-align: center;
        transition: color var(--dur-base) var(--ease-out);
      }
      .sponsor-cell:hover .sponsor-cell__name {
        color: var(--ink-900);
      }

      /* FAQ */
      .faq-list {
        border-top: 1px solid var(--border-light);
      }
      .faq-item {
        border-bottom: 1px solid var(--border-light);
      }
      .faq-item__trigger {
        width: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--s-6);
        padding: clamp(20px, 2.6vw, 30px) 0;
        text-align: left;
        transition: color var(--dur-base) var(--ease-out);
      }
      .faq-item__trigger:hover {
        color: var(--amber-700);
      }
      .faq-item__q {
        font-family: var(--font-display);
        font-size: clamp(1.0625rem, 1.7vw, 1.375rem);
        line-height: 1.3;
        letter-spacing: -0.015em;
        font-weight: 500;
      }
      .faq-item__icon {
        flex: none;
        position: relative;
        width: 20px;
        height: 20px;
        margin-top: 4px;
      }
      .faq-item__icon::before,
      .faq-item__icon::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        background: currentColor;
        border-radius: 2px;
        transition:
          transform var(--dur-base) var(--ease-out),
          opacity var(--dur-base) var(--ease-out);
      }
      .faq-item__icon::before {
        width: 14px;
        height: 1.5px;
        transform: translate(-50%, -50%);
      }
      .faq-item__icon::after {
        width: 1.5px;
        height: 14px;
        transform: translate(-50%, -50%);
      }
      .faq-item__trigger[aria-expanded="true"] .faq-item__icon::after {
        transform: translate(-50%, -50%) scaleY(0);
        opacity: 0;
      }
      .faq-item__trigger[aria-expanded="true"] .faq-item__icon::before {
        transform: translate(-50%, -50%) rotate(180deg);
      }
      .faq-item__panel {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows var(--dur-slow) var(--ease-out);
      }
      .faq-item__panel[data-open="true"] {
        grid-template-rows: 1fr;
      }
      .faq-item__panel-inner {
        overflow: hidden;
      }
      .faq-item__a {
        padding-bottom: clamp(20px, 2.6vw, 30px);
        max-width: 68ch;
        color: var(--ink-500);
        line-height: 1.72;
        font-size: 0.9375rem;
      }

      /* FINAL CTA */
      .final-cta {
        position: relative;
        isolation: isolate;
        color: #fff;
        text-align: center;
        overflow: hidden;
      }
      .final-cta__inner {
        display: grid;
        gap: var(--s-7);
        justify-items: center;
        max-width: 900px;
        margin-inline: auto;
      }
      .final-cta__title {
        font-family: var(--font-display);
        font-size: clamp(2rem, 4.6vw, 3.5rem);
        line-height: 1.08;
        letter-spacing: var(--ls-tighter);
        text-wrap: balance;
        text-shadow: 0 2px 24px rgba(10, 30, 74, 0.4);
      }
      .final-cta__title em {
        font-style: italic;
        font-weight: 300;
        color: var(--amber-400);
      }
      .final-cta__ctas {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-3);
        justify-content: center;
      }

      /* FOOTER */
      .site-footer {
        background: var(--brand-950);
        color: #fff;
        border-top: 1px solid var(--border-dark);
      }
      .site-footer__top {
        display: grid;
        gap: clamp(32px, 5vw, 64px);
        padding-block: clamp(56px, 7vw, 88px);
      }
      @media (min-width: 900px) {
        .site-footer__top {
          grid-template-columns: 1.6fr 1fr 1fr 1fr;
        }
      }
      .site-footer__brand {
        display: grid;
        gap: var(--s-5);
        align-content: start;
        max-width: 40ch;
      }
      .site-footer__desc {
        font-size: 0.875rem;
        line-height: 1.7;
        color: rgba(255, 255, 255, 0.72);
      }
      .site-footer__social {
        display: flex;
        gap: var(--s-2);
        margin-top: var(--s-2);
      }
      .site-footer__social a {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 1px solid var(--border-dark);
        border-radius: var(--r-full);
        color: #fff;
        transition:
          background-color var(--dur-base) var(--ease-out),
          border-color var(--dur-base) var(--ease-out);
      }
      .site-footer__social a:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.4);
      }
      .site-footer__social svg {
        width: 15px;
        height: 15px;
      }
      .site-footer__col-title {
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--amber-400);
        margin-bottom: var(--s-4);
      }
      .site-footer__links {
        display: grid;
        gap: 10px;
      }
      .site-footer__links a {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.72);
        transition: color var(--dur-base) var(--ease-out);
        width: fit-content;
      }
      .site-footer__links a:hover {
        color: #fff;
      }
      .site-footer__bottom {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-4) var(--s-6);
        align-items: center;
        justify-content: space-between;
        padding-block: var(--s-6);
        border-top: 1px solid var(--border-dark);
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.6);
      }
      .site-footer__legal {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-5);
      }
      .site-footer__legal a:hover {
        color: #fff;
      }

      /* REVEAL */
      .reveal {
        opacity: 0;
        transform: translateY(22px);
        transition:
          opacity var(--dur-reveal) var(--ease-out),
          transform var(--dur-reveal) var(--ease-out);
      }
      .reveal.is-visible {
        opacity: 1;
        transform: none;
      }
      .reveal[data-delay="1"] {
        transition-delay: 80ms;
      }
      .reveal[data-delay="2"] {
        transition-delay: 160ms;
      }
      .reveal[data-delay="3"] {
        transition-delay: 240ms;
      }
      .reveal[data-delay="4"] {
        transition-delay: 320ms;
      }
      .reveal[data-delay="5"] {
        transition-delay: 400ms;
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal {
          opacity: 1 !important;
          transform: none !important;
          transition: none !important;
        }
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* VOTE PAGE */
      .vote-page {
        padding-top: calc(var(--header-h) + 24px);
        padding-bottom: 96px;
        min-height: 100svh;
      }
      .vote-shell {
        width: 100%;
        max-width: var(--shell-max);
        margin-inline: auto;
        padding-inline: var(--shell-pad);
      }
      .vote-summary {
        display: grid;
        gap: var(--s-5);
        padding-block: clamp(24px, 3vw, 40px);
        border-bottom: 1px solid var(--border-light);
        margin-bottom: clamp(28px, 4vw, 56px);
      }
      @media (min-width: 800px) {
        .vote-summary {
          grid-template-columns: 1fr auto;
          align-items: end;
        }
      }
      .vote-summary__title {
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 3.4vw, 2.5rem);
        line-height: 1.08;
        letter-spacing: var(--ls-tighter);
      }
      .vote-summary__sub {
        font-size: 0.9375rem;
        color: var(--ink-500);
        margin-top: var(--s-2);
        max-width: 60ch;
        line-height: 1.6;
      }
      .vote-count {
        display: grid;
        gap: var(--s-3);
        min-width: min(300px, 100%);
      }
      .vote-count__row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--s-4);
      }
      .vote-count__label {
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-500);
      }
      .vote-count__value {
        font-family: var(--font-display);
        font-size: 1.375rem;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .vote-count__value span {
        color: var(--ink-400);
        font-size: 0.875rem;
      }
      .vote-count__track {
        height: 5px;
        border-radius: 3px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .vote-count__fill {
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--brand-700), var(--amber-500));
        transform-origin: left;
        transform: scaleX(0);
        transition: transform var(--dur-slow) var(--ease-out);
      }

      .category-block {
        margin-bottom: clamp(48px, 6vw, 80px);
      }
      .category-block__head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: var(--s-5);
        margin-bottom: var(--s-6);
        padding-bottom: var(--s-4);
        border-bottom: 1px solid var(--border-light);
      }
      .category-block__title {
        font-family: var(--font-display);
        font-size: clamp(1.375rem, 2.2vw, 1.875rem);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .category-block__blurb {
        font-size: 0.875rem;
        color: var(--ink-500);
        margin-top: 6px;
        max-width: 56ch;
      }
      .category-block__status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: var(--r-full);
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
        background: var(--ink-100);
        color: var(--ink-600);
      }
      .category-block__status--complete {
        background: var(--teal-100);
        color: var(--teal-700);
      }
      .category-block__status svg {
        width: 12px;
        height: 12px;
      }

      /* VOTE MODAL */
      .vote-modal__nominee {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: var(--s-5);
        align-items: center;
        padding: var(--s-5);
        border-radius: var(--r-lg);
        background: linear-gradient(135deg, var(--brand-900), var(--brand-700));
        color: #fff;
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .vote-modal__nominee::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(
          ellipse at 80% 20%,
          rgba(245, 165, 36, 0.4),
          transparent 60%
        );
      }
      .vote-modal__thumb {
        width: 100px;
        height: 100px;
        border-radius: var(--r-md);
        overflow: hidden;
        background: var(--brand-800);
        flex: none;
      }
      .vote-modal__thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .vote-modal__eyebrow {
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--amber-400);
        margin-bottom: 4px;
      }
      .vote-modal__name {
        font-family: var(--font-display);
        font-size: 1.25rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
        color: #fff;
      }
      .vote-modal__loc {
        font-size: 0.8125rem;
        color: rgba(255, 255, 255, 0.78);
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .vote-modal__loc svg {
        width: 12px;
        height: 12px;
      }

      /* MODAL */
      .modal-scrim {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(10, 30, 74, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: grid;
        place-items: center;
        padding: var(--s-5);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity var(--dur-base) var(--ease-out),
          visibility var(--dur-base);
      }
      .modal-scrim[data-open="true"] {
        opacity: 1;
        visibility: visible;
      }
      .modal {
        width: 100%;
        max-width: 560px;
        background: var(--ivory-50);
        border-radius: var(--r-xl);
        padding: clamp(24px, 4vw, 40px);
        box-shadow: var(--sh-xl);
        display: grid;
        gap: var(--s-5);
        transform: translateY(16px) scale(0.98);
        transition: transform var(--dur-slow) var(--ease-out);
        max-height: 92svh;
        overflow-y: auto;
      }
      .modal-scrim[data-open="true"] .modal {
        transform: none;
      }
      .modal__title {
        font-family: var(--font-display);
        font-size: 1.5rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .modal__body {
        color: var(--ink-600);
        font-size: 0.9375rem;
        line-height: 1.7;
      }
      .modal__actions {
        display: flex;
        gap: var(--s-3);
        flex-wrap: wrap;
        margin-top: var(--s-2);
      }
      .modal__actions .btn {
        flex: 1;
        min-width: 130px;
      }

      .form-field {
        display: grid;
        gap: 6px;
      }
      .form-field label {
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-600);
      }
      .form-field input,
      .form-field textarea {
        padding: 13px 16px;
        border: 1px solid var(--border-light);
        border-radius: var(--r-sm);
        background: #fff;
        font-size: 0.9375rem;
        font-family: inherit;
        transition:
          border-color var(--dur-base) var(--ease-out),
          box-shadow var(--dur-base) var(--ease-out);
      }
      .form-field input::placeholder {
        color: var(--ink-400);
      }
      .form-field input:focus,
      .form-field textarea:focus {
        border-color: var(--amber-500);
        box-shadow: 0 0 0 4px rgba(245, 165, 36, 0.18);
      }
      .form-field input[aria-invalid="true"] {
        border-color: var(--danger);
        background: rgba(220, 38, 38, 0.03);
      }
      .form-field__error {
        color: var(--danger);
        font-size: 0.75rem;
        min-height: 1em;
        font-weight: 500;
      }
      .form-grid {
        display: grid;
        gap: var(--s-4);
      }

      .modal__note {
        font-size: 0.75rem;
        color: var(--ink-500);
        line-height: 1.6;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .modal__note svg {
        width: 14px;
        height: 14px;
        flex: none;
        margin-top: 3px;
        color: var(--teal-600);
      }

      /* TOAST */
      .toast-region {
        position: fixed;
        z-index: 300;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        gap: var(--s-2);
        width: min(420px, calc(100vw - 32px));
        pointer-events: none;
      }
      @media (min-width: 901px) {
        .toast-region {
          bottom: auto;
          top: calc(var(--header-h) + 16px);
          left: auto;
          right: 24px;
          transform: none;
        }
      }
      .toast {
        display: flex;
        align-items: center;
        gap: var(--s-3);
        padding: 14px 18px;
        border-radius: var(--r-md);
        background: var(--brand-900);
        color: #fff;
        box-shadow: var(--sh-lg);
        font-size: 0.875rem;
        font-weight: 500;
        border: 1px solid var(--border-dark);
        animation: toastIn 380ms var(--ease-spring) both;
        pointer-events: auto;
      }
      .toast--success {
        border-color: rgba(20, 184, 166, 0.55);
      }
      .toast--error {
        border-color: rgba(220, 38, 38, 0.55);
      }
      .toast svg {
        width: 17px;
        height: 17px;
        flex: none;
      }
      .toast--success svg {
        color: #5eead4;
      }
      .toast--error svg {
        color: #fca5a5;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(-10px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* LIGHTBOX */
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 250;
        background: rgba(10, 30, 74, 0.96);
        display: grid;
        grid-template-rows: auto 1fr auto;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity var(--dur-base) var(--ease-out),
          visibility var(--dur-base);
      }
      .lightbox[data-open="true"] {
        opacity: 1;
        visibility: visible;
      }
      .lightbox__bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--s-4) var(--s-5);
        color: #fff;
      }
      .lightbox__counter {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.72);
        font-variant-numeric: tabular-nums;
      }
      .lightbox__close {
        width: 44px;
        height: 44px;
