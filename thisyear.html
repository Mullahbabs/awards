      .review-row {
        display: grid;
        gap: var(--s-3) var(--s-5);
        grid-template-columns: 1fr auto;
        align-items: center;
        padding: var(--s-5) clamp(20px, 2.6vw, 32px);
        border-bottom: 1px solid var(--border-light);
      }
      .review-row:last-child {
        border-bottom: 0;
      }
      .review-row__cat {
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-500);
        margin-bottom: 5px;
      }
      .review-row__nom {
        font-family: var(--font-display);
        font-size: 1.125rem;
        letter-spacing: -0.015em;
      }
      .review-row__nom--empty {
        color: var(--danger);
        font-size: 1rem;
        font-family: var(--font-sans);
        font-weight: 500;
      }

      /* SUCCESS */
      .success-wrap {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: calc(var(--header-h) + 48px) var(--shell-pad) 96px;
        background: var(--navy-950);
        color: var(--fg-on-dark);
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .success-wrap::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(
            ellipse 55% 55% at 50% 20%,
            rgba(201, 169, 97, 0.2),
            transparent 62%
          ),
          radial-gradient(
            ellipse 70% 60% at 50% 100%,
            rgba(27, 94, 79, 0.28),
            transparent 64%
          );
      }
      .success-card {
        width: 100%;
        max-width: 660px;
        text-align: center;
        display: grid;
        gap: var(--s-7);
        justify-items: center;
        padding: clamp(32px, 5vw, 64px);
        border: 1px solid var(--border-dark);
        border-radius: var(--r-xl);
        background: rgba(10, 20, 40, 0.5);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: var(--sh-xl);
      }
      .success-mark {
        width: 76px;
        height: 76px;
        border-radius: var(--r-full);
        display: grid;
        place-items: center;
        background: var(--jade-600);
        color: #fff;
        box-shadow: 0 0 0 12px rgba(27, 94, 79, 0.16);
        animation: pop 620ms var(--ease-spring) both;
      }
      @keyframes pop {
        from {
          transform: scale(0.5);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .success-mark svg {
        width: 34px;
        height: 34px;
      }
      .success-title {
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 3.6vw, 2.5rem);
        line-height: 1.1;
        letter-spacing: var(--ls-tighter);
      }
      .success-sub {
        color: var(--fg-on-dark-muted);
        font-size: 1rem;
        line-height: 1.7;
        max-width: 44ch;
      }
      .success-refs {
        display: grid;
        gap: 1px;
        width: 100%;
        background: var(--border-dark);
        border: 1px solid var(--border-dark);
        border-radius: var(--r-md);
        overflow: hidden;
        grid-template-columns: 1fr;
      }
      @media (min-width: 560px) {
        .success-refs {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      .success-ref {
        background: rgba(5, 11, 24, 0.5);
        padding: var(--s-5) var(--s-4);
        display: grid;
        gap: 6px;
      }
      .success-ref dt {
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-on-dark-muted);
      }
      .success-ref dd {
        font-family: var(--font-mono);
        font-size: 0.875rem;
        color: var(--gold-400);
        word-break: break-all;
      }
      .success-ctas {
        display: flex;
        flex-wrap: wrap;
        gap: var(--s-3);
        justify-content: center;
      }

      /* MODAL */
      .modal-scrim {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(5, 11, 24, 0.68);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: grid;
        place-items: center;
        padding: var(--s-5);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity var(--dur-base) var(--ease-out),
          visibility var(--dur-base);
      }
      .modal-scrim[data-open="true"] {
        opacity: 1;
        visibility: visible;
      }
      .modal {
        width: 100%;
        max-width: 560px;
        background: var(--ivory-50);
        border-radius: var(--r-xl);
        padding: clamp(24px, 4vw, 40px);
        box-shadow: var(--sh-xl);

        function esc(str) {
          return String(str ?? "").replace(
            /[&<>"']/g,
            (ch) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[ch],
          );

        function initials(name) {
          return String(name)
            .replace(/[^\p{L}\p{N} ]/gu, " ")
            .split(/\s+/)
            .filter(Boolean)
            .slice(0, 2)
            .map((w) => w[0].toUpperCase())
            .join("");
        }
        function trapFocus(container) {
          const selector =
            'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
          function handler(e) {
            if (e.key !== "Tab") return;
            const nodes = $$(selector, container).filter(
              (el) => el.offsetParent !== null || el === document.activeElement,
            );
            if (!nodes.length) return;
            const first = nodes[0],
              last = nodes[nodes.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
          container.addEventListener("keydown", handler);
          return () => container.removeEventListener("keydown", handler);
        }

        const VotingService = (() => {
          const STORAGE_KEY = "pfea.ballot.v1";
          const CLIENT_ID_KEY = "pfea.voter.v1";

          function getClientToken() {
            try {
              let token = localStorage.getItem(CLIENT_ID_KEY);
              if (!token) {
                token = crypto.randomUUID
                  ? crypto.randomUUID()
                  : String(Date.now()) + Math.random().toString(36).slice(2);
                localStorage.setItem(CLIENT_ID_KEY, token);
              }
              return token;
            } catch {
              return "anonymous";
            }
          }

          function loadDraft() {
            try {
              const raw = localStorage.getItem(STORAGE_KEY);
              return raw ? JSON.parse(raw) : {};
            } catch {
              return {};
            }
          }
          function saveDraft(votes) {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));
            } catch {}
          }
          function clearDraft() {
            try {
              localStorage.removeItem(STORAGE_KEY);
            } catch {}
          }

          function isVotingOpen() {
            if (CONFIG.voting.forceClosed) return false;
            const now = Date.now();
            return (
              now >= Date.parse(CONFIG.voting.opensISO) &&
              now <= Date.parse(CONFIG.voting.closesISO)
            );
          }

          function validateBallot(votes) {
            const errors = [];
            if (!isVotingOpen()) errors.push("Voting is not currently open.");
            CATEGORIES.forEach((cat) => {
              const nomineeId = votes[cat.id];
              if (!nomineeId) {
                errors.push(`No selection for ${cat.name}.`);
                return;
              }
              const nominee = NOMINEE_BY_ID[nomineeId];
              if (!nominee || nominee.categoryId !== cat.id) {
                errors.push(`Invalid selection for ${cat.name}.`);
              }
            });
            return errors;
          }

          function isEmailjsConfigured() {
            const c = CONFIG.emailjs;
            return Boolean(
              window.emailjs &&
              c.publicKey &&
              c.publicKey !== "YOUR_PUBLIC_KEY_HERE" &&
              c.serviceId &&
              c.serviceId !== "YOUR_SERVICE_ID_HERE" &&
              c.templateId &&
              c.templateId !== "YOUR_TEMPLATE_ID_HERE",
            );
          }

          /* Build a plain-text ballot summary suitable for inclusion in an email body. */
          function buildBallotSummary(selections) {
            const lines = [];
            lines.push("BALLOT SELECTIONS");
            lines.push("=================");
            lines.push("");
            CATEGORIES.forEach((cat) => {
              const nomineeId = selections[cat.id];
              if (!nomineeId) return;
              const nominee = NOMINEE_BY_ID[nomineeId];
              if (!nominee) return;
              lines.push(`${String(cat.index).padStart(2, "0")}. ${cat.name}`);
              lines.push(`    Nominee: ${nominee.name}`);
              lines.push(`    Location: ${nominee.location}`);
              lines.push(`    Category ID: ${cat.id}`);
              lines.push(`    Nominee ID: ${nominee.id}`);
              lines.push("");
            });
            return lines.join("\n");
          }

          /* Build numbered vote_N_* fields for maximum EmailJS template flexibility. */
          function buildIndividualFields(selections) {
            const fields = {};
            let i = 1;
            CATEGORIES.forEach((cat) => {
              const nomineeId = selections[cat.id];
              if (!nomineeId) return;
              const nominee = NOMINEE_BY_ID[nomineeId];
              if (!nominee) return;
              fields[`vote_${i}_category`] = cat.name;
              fields[`vote_${i}_category_id`] = cat.id;
              fields[`vote_${i}_nominee`] = nominee.name;
              fields[`vote_${i}_nominee_id`] = nominee.id;
              fields[`vote_${i}_location`] = nominee.location;
              fields[`vote_${i}_description`] = nominee.description;
              i++;
            });
            fields.votes_count = i - 1;
            return fields;
          }

          return {
            getClientToken,
            loadDraft,
            saveDraft,
            clearDraft,
            isVotingOpen,
            validateBallot,
            isEmailjsConfigured,

            /**
             * Submit a ballot. `voter` must be { name, phone, email }.
             * The full ballot and per-category nominee details are sent in a single
             * EmailJS message.
             */
            async submitBallot(selections, voter) {
              const errors = validateBallot(selections);
              if (errors.length) {
                const err = new Error(errors[0]);
                err.code = "VALIDATION";
                err.details = errors;
                throw err;
              }

              if (!voter || !voter.name || !voter.email || !voter.phone) {
                const err = new Error("Voter details are incomplete.");
                err.code = "VOTER";
                throw err;
              }

              const reference =
                "PFEA-" +
                new Date().getFullYear() +
                "-" +
                Math.random().toString(36).slice(2, 8).toUpperCase();
              const submittedAt = new Date();
              const submittedAtISO = submittedAt.toISOString();
              const submittedAtLabel = submittedAt.toLocaleString("en-GB", {
                day: "numeric",
                month: "long",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
              });

              /* EmailJS template parameters */
              const templateParams = Object.assign(
                {
                  to_email: CONFIG.emailjs.toEmail,
                  to_name: CONFIG.org.name,

                  subject: `New Ballot Submission — ${reference}`,

                  reference: reference,

        function initHero() {
          const hero = $("#hero");

          const reduced = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;
          heroSlides = $$(".hero__slide", hero);
          const dots = $$("[data-hero-dot]", hero);
          const eyebrowEl = $("[data-hero-eyebrow]", hero);
          const titleEl = $("[data-hero-title]", hero);
          const copyEl = $("[data-hero-copy]", hero);

          function goTo(index) {
            heroIndex = (index + heroSlides.length) % heroSlides.length;
            heroSlides.forEach((el, i) => {
              const active = i === heroIndex;
              el.dataset.active = String(active);
              el.setAttribute("aria-hidden", String(!active));
            });
            dots.forEach((d, i) =>
              d.setAttribute("aria-selected", String(i === heroIndex)),
            );

            const s = HERO_SLIDES[heroIndex];
            const apply = () => {
              eyebrowEl.textContent = s.eyebrow;
              titleEl.innerHTML = s.title;
              copyEl.textContent = s.copy;
            };
            if (reduced) {
              apply();
            } else {
              [eyebrowEl, titleEl, copyEl].forEach((el) => {
                el.style.transition =
                  "opacity 320ms var(--ease-out), transform 320ms var(--ease-out)";
                el.style.opacity = "0";
                el.style.transform = "translateY(10px)";
              });
              setTimeout(() => {
                apply();
                [eyebrowEl, titleEl, copyEl].forEach((el, i) => {
                  el.style.transitionDelay = i * 60 + "ms";
                  el.style.opacity = "1";
                  el.style.transform = "none";
                });
              }, 200);
            }
            restartAutoplay();
          }
          function restartAutoplay() {
            clearInterval(heroTimer);
            if (reduced || heroPaused) return;
            heroTimer = setInterval(() => goTo(heroIndex + 1), 7500);
          }
          function stopAutoplay() {
            clearInterval(heroTimer);
          }

          $("[data-hero-prev]", hero).addEventListener("click", () =>
            goTo(heroIndex - 1),
          );
          $("[data-hero-next]", hero).addEventListener("click", () =>
            goTo(heroIndex + 1),
          );
          dots.forEach((d) =>
            d.addEventListener("click", () => goTo(Number(d.dataset.heroDot))),
          );

          hero.addEventListener("mouseenter", () => {
            heroPaused = true;
            stopAutoplay();
          });
          hero.addEventListener("mouseleave", () => {
            heroPaused = false;
            restartAutoplay();
          });
          hero.addEventListener("focusin", stopAutoplay);
          hero.addEventListener("focusout", restartAutoplay);
          hero.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") {
              e.preventDefault();
              goTo(heroIndex - 1);
            }
            if (e.key === "ArrowRight") {
              e.preventDefault();
              goTo(heroIndex + 1);
            }
          });

          let startX = null,
            startY = null;
          hero.addEventListener(
            "pointerdown",
            (e) => {
              if (e.pointerType === "mouse") return;
              startX = e.clientX;
              startY = e.clientY;
            },
            { passive: true },
          );
          hero.addEventListener(
            "pointerup",
            (e) => {
              if (startX === null) return;
              const dx = e.clientX - startX,
                dy = e.clientY - startY;
              if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy))
                goTo(dx < 0 ? heroIndex + 1 : heroIndex - 1);
              startX = null;
              startY = null;
            },
            { passive: true },
          );

          document.addEventListener("visibilitychange", () => {
            if (document.hidden) stopAutoplay();
            else restartAutoplay();
          });
          restartAutoplay();
        }

        function initCountdown() {
          const root = $("[data-countdown]");
          if (!root) return;
          const target = Date.parse(CONFIG.event.startISO);
          const values = $$("[data-cd]", root);
          const rings = $$("[data-ring]", root);
          const CIRC = 289;
          const UNIT_MS = [86400000, 3600000, 60000, 1000];
          const UNIT_MAX = [365, 24, 60, 60];
          const pad = (n) => String(n).padStart(2, "0");

          function tick() {
            let diff = target - Date.now();
            if (diff < 0) diff = 0;
            const units = [
              Math.floor(diff / UNIT_MS[0]),
              Math.floor((diff / UNIT_MS[1]) % 24),
              Math.floor((diff / UNIT_MS[2]) % 60),
              Math.floor((diff % 60000) / 1000),
            ];
            units.forEach((val, i) => {
              if (values[i]) values[i].textContent = pad(val);
              if (rings[i]) {
                const progress = Math.min(val / UNIT_MAX[i], 1);
                rings[i].style.strokeDashoffset = String(CIRC * (1 - progress));
              }
            });
          }
          tick();
          setInterval(tick, 1000);
        }

        function buildIcsDataUri() {

          const lines = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//People First Enterprise Awards//EN",
            "CALSCALE:GREGORIAN",
            "BEGIN:VEVENT",
            `UID:${Date.now()}@peoplefirstawards.example`,
            `DTSTAMP:${fmt(new Date().toISOString())}`,
            `DTSTART:${fmt(e.startISO)}`,
            `DTEND:${fmt(e.endISO)}`,
            `SUMMARY:${e.name}`,
            `LOCATION:${e.venue}\\, ${e.city}\\, ${e.country}`,
            "DESCRIPTION:Celebrating the people and businesses shaping tomorrow.",
            "END:VEVENT",
            "END:VCALENDAR",
          ];
          return (
            "data:text/calendar;charset=utf-8," +
            encodeURIComponent(lines.join("\r\n"))
          );
        }
        function googleCalendarUrl() {
          const e = CONFIG.event;

          return (

        let lightboxCleanup = null;
        function openLightbox(index) {
          state.galleryIndex = index;
          const root = $("#lightbox-root");
          const art = (tone) =>
            `<div class="g-item__bg g-item__bg--${tone}"></div>`;

          function render() {
            const item = GALLERY_ITEMS[state.galleryIndex];
            root.innerHTML = `
      <div class="lightbox" data-open="false" role="dialog" aria-modal="true" aria-label="Image viewer" data-lightbox>
        <div class="lightbox__bar">
          <span class="lightbox__counter">${state.galleryIndex + 1} / ${GALLERY_ITEMS.length}</span>
          <button class="lightbox__close" type="button" aria-label="Close viewer" data-lb-close>${icon("close")}</button>
        </div>
        <div class="lightbox__stage">
          <div class="lightbox__art" style="position:relative">${art(item.tone)}</div>
          <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous image" data-lb-prev>${icon("arrowLeft")}</button>
          <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next image" data-lb-next>${icon("arrowRight")}</button>
        </div>
        <p class="lightbox__caption" data-lb-caption>${esc(item.caption)}</p>
      </div>`;
          }
          render();

          const lb = $("[data-lightbox]", root);
          requestAnimationFrame(() => {
            lb.dataset.open = "true";
          });
          document.body.classList.add("no-scroll");
          const prevFocus = document.activeElement;
          $("[data-lb-close]", lb).focus();

          function close() {
            lb.dataset.open = "false";
            document.body.classList.remove("no-scroll");
            if (lightboxCleanup) lightboxCleanup();
            prevFocus && prevFocus.focus();
            setTimeout(() => {
              root.innerHTML = "";
            }, 320);
          }
          function go(delta) {
            state.galleryIndex =
              (state.galleryIndex + delta + GALLERY_ITEMS.length) %
              GALLERY_ITEMS.length;
            const stage = $(".lightbox__art", lb);
            const item = GALLERY_ITEMS[state.galleryIndex];
            stage.style.opacity = "0";
            setTimeout(() => {
              stage.innerHTML = art(item.tone);
              $("[data-lb-caption]", lb).textContent = item.caption;
              $(".lightbox__counter", lb).textContent =
                `${state.galleryIndex + 1} / ${GALLERY_ITEMS.length}`;
              stage.style.transition = "opacity 300ms";
              stage.style.opacity = "1";
            }, 140);
          }

          $("[data-lb-close]", lb).addEventListener("click", close);
          $("[data-lb-prev]", lb).addEventListener("click", () => go(-1));
          $("[data-lb-next]", lb).addEventListener("click", () => go(1));
          lb.addEventListener("keydown", (e) => {
            if (e.key === "Escape") close();
            if (e.key === "ArrowLeft") go(-1);
            if (e.key === "ArrowRight") go(1);
          });
          const removeTrap = trapFocus(lb);
          lightboxCleanup = removeTrap;
        }

        function initNomineeFilter() {
          const input = $("[data-nom-search]");
          const select = $("[data-nom-cat]");
          const grid = $("[data-nom-grid]");
          const empty = $("[data-nom-empty]");
          if (!grid) return;
          function apply() {
            const q = (input?.value || "").trim().toLowerCase();
            const cat = select?.value || "all";
            let visible = 0;
            $$(".nom-card", grid).forEach((card) => {
              const link = card
                .querySelector(".nom-card__name a")
                .getAttribute("href");
              const id = link.split("/").pop();
              const nominee = NOMINEE_BY_ID[id];
              if (!nominee) return;
              const matchesQuery =
                !q ||
                nominee.name.toLowerCase().includes(q) ||
                nominee.description.toLowerCase().includes(q) ||
                nominee.location.toLowerCase().includes(q);
              const matchesCat = cat === "all" || nominee.categoryId === cat;
              const show = matchesQuery && matchesCat;
              card.style.display = show ? "" : "none";
              if (show) visible++;
            });
            empty.hidden = visible > 0;
          }
          input?.addEventListener("input", apply);
          select?.addEventListener("change", apply);
        }

          const pct = Math.round((completed / total) * 100);
          return { completed, total, pct, remaining: total - completed };

        function initVoteView() {
          const host = $("[data-vote-panel-host]");
          if (!host) return;

          const params = new URLSearchParams(location.search);
          const deepLink = params.get("category");
          if (deepLink) {
            const i = CATEGORIES.findIndex((c) => c.id === deepLink);
            if (i >= 0) state.activeCategoryIndex = i;
          }

          function refresh() {
            host.innerHTML = renderVotePanel();
            const navHost = $(".cat-nav");
            if (navHost) navHost.outerHTML = renderCategoryNavigator();
            const strip = $(".cat-strip");
            if (strip) strip.outerHTML = renderMobileCategoryStrip();
            bindPanel();
            bindNavigator();
            updateProgressBars();
          }

          function updateProgressBars() {
            const { completed, total, pct, remaining } = ballotProgress();
            $$("[data-ballot-completed]").forEach((el) => {
              el.textContent = String(completed);
            });
            $$("[data-ballot-pct]").forEach((el) => {
              el.textContent = String(pct);
            });
            $$("[data-ballot-fill]").forEach((el) => {
              el.style.transform = `scaleX(${pct / 100})`;
            });
            const remainingEl = $("[data-ballot-remaining]");
            if (remainingEl) remainingEl.textContent = String(remaining);
            const status = $("#ballot-status");
            if (status)
              status.textContent = `${completed} of ${total} categories completed. ${remaining} remaining.`;
            const review = $("[data-review]");
            if (review) {
              const blocked = remaining > 0;
              review.disabled = blocked;
              review.setAttribute("aria-disabled", String(blocked));
              review.innerHTML = blocked
                ? "Complete all categories"
                : `Review &amp; Submit Votes ${icon("arrowRight", "btn__icon btn__icon--arrow")}`;
            }
          }

          function select(nomineeId, categoryId) {
            state.votes[categoryId] = nomineeId;
            VotingService.saveDraft(state.votes);
            $$(`.vnom[data-category-id="${categoryId}"]`).forEach((card) => {
              const isSelected = card.dataset.nomineeId === nomineeId;
              card.dataset.selected = String(isSelected);
              card.setAttribute("aria-checked", String(isSelected));
              const label = card.querySelector(".vnom__vote-label");
              if (label)
                label.textContent = isSelected ? "Selected" : "Select nominee";
            });
            updateProgressBars();
            const cat = CATEGORY_BY_ID[categoryId];
            const nom = NOMINEE_BY_ID[nomineeId];
            toast(`${nom.name} selected for ${cat.name}`, "success");
          }

          function bindPanel() {
            const group = $("[data-nominee-group]", host);
            if (!group) return;
            $$(".vnom", group).forEach((card) => {
              card.addEventListener("click", () =>
                select(card.dataset.nomineeId, card.dataset.categoryId),
              );
              card.addEventListener("keydown", (e) => {
                if (e.key === " " || e.key === "Enter") {
                  e.preventDefault();
                  select(card.dataset.nomineeId, card.dataset.categoryId);
                }
                if (
                  ["ArrowDown", "ArrowRight", "ArrowUp", "ArrowLeft"].includes(
                    e.key,
                  )
                ) {
                  e.preventDefault();
                  const cards = $$(".vnom", group);
                  const i = cards.indexOf(card);
                  const dir =
                    e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1;
                  const next = cards[(i + dir + cards.length) % cards.length];
                  next.focus();
                }
              });
            });
            $("[data-vote-prev]", host)?.addEventListener("click", () => {
              if (state.activeCategoryIndex > 0) {
                state.activeCategoryIndex--;
                refresh();
                scrollToBallotTop();
              }
            });
            $("[data-vote-next]", host)?.addEventListener("click", () => {
              if (state.activeCategoryIndex < CATEGORIES.length - 1) {
                state.activeCategoryIndex++;
                refresh();
                scrollToBallotTop();
              }
            });
            $("[data-review]")?.addEventListener("click", () => {
              const errors = VotingService.validateBallot(state.votes);
              if (errors.length) {
                toast(errors[0], "error");
                return;
              }
              navigate("/review");
            });
          }

          function bindNavigator() {
            $$("[data-goto-category]").forEach((btn) => {
              btn.addEventListener("click", () => {
                state.activeCategoryIndex = Number(btn.dataset.gotoCategory);
                refresh();
                scrollToBallotTop();
              });
            });

          function scrollToBallotTop() {
            const panel = $(".vote-panel");
            if (!panel) return;
            const y = panel.getBoundingClientRect().top + window.scrollY - 100;
            window.scrollTo({
              top: y,
              behavior: window.matchMedia("(prefers-reduced-motion: reduce)")
                .matches
                ? "auto"
                : "smooth",
            });
            const heading = $("#vote-category-title");
            if (heading) {
              heading.setAttribute("tabindex", "-1");
              heading.focus({ preventScroll: true });
            }
          }

          bindPanel();
          bindNavigator();
          updateProgressBars();
        }

        function initReveal() {
          const nodes = $$(".reveal:not(.is-visible)");
          if (!nodes.length) return;
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            nodes.forEach((n) => n.classList.add("is-visible"));
            return;
          }
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  io.unobserve(entry.target);
                }
              });
            },
            { rootMargin: "0px 0px -8% 0px", threshold: 0.08 },
          );
          nodes.forEach((n) => io.observe(n));
        }

        function initCounters() {
          const nodes = $$("[data-counter]");
          if (!nodes.length) return;
          const reduced = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (!entry.isIntersecting) return;
                const el = entry.target;
                const target = Number(el.dataset.counter);
                io.unobserve(el);
                if (reduced) {
                  el.textContent = target.toLocaleString("en-GB");
                  return;
                }
                const duration = 1500;
                const start = performance.now();
                function frame(now) {
                  const t = Math.min((now - start) / duration, 1);
                  const eased = 1 - Math.pow(1 - t, 3);
                  el.textContent = Math.round(target * eased).toLocaleString(
                    "en-GB",
                  );
                  if (t < 1) requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
              });
            },
            { threshold: 0.4 },
          );
          nodes.forEach((n) => io.observe(n));
        }

        function initLinkInterception() {
          document.addEventListener("click", (e) => {
            const link = e.target.closest("a[data-link]");
            if (!link) return;
            const href = link.getAttribute("href");
            if (
              !href ||
              href.startsWith("http") ||
              href.startsWith("mailto") ||
              href.startsWith("tel")
            )
              return;
            if (link.target === "_blank") return;
            e.preventDefault();
            navigate(href);
          });
        }

        function updateMeta() {
          const { name } = state.route;
          const titles = {
            home: `${CONFIG.org.name} — ${CONFIG.org.tagline}`,
            about: `About — ${CONFIG.org.name}`,
            categories: `Award Categories — ${CONFIG.org.name}`,
            category: `${CATEGORY_BY_ID[state.route.params.slug]?.name || "Category"} — ${CONFIG.org.name}`,
            nominees: `Nominees — ${CONFIG.org.name}`,
            nominee: `${NOMINEE_BY_ID[state.route.params.id]?.name || "Nominee"} — ${CONFIG.org.name}`,
            vote: `Vote — ${CONFIG.org.name}`,
            review: `Review Your Ballot — ${CONFIG.org.name}`,
            success: `Vote Submitted — ${CONFIG.org.name}`,
            event: `The Ceremony — ${CONFIG.org.name}`,
            gallery: `Gallery — ${CONFIG.org.name}`,
            faq: `FAQ — ${CONFIG.org.name}`,
            contact: `Contact — ${CONFIG.org.name}`,
            notFound: `Page Not Found — ${CONFIG.org.name}`,
          };
          document.title = titles[name] || CONFIG.org.name;
        }

        function updateHeaderState() {
          const header = $("#site-header");
          if (!header) return;
          const isHome = state.route.name === "home";
          const scrolled = window.scrollY > 24;
          const solid = !isHome || scrolled;
          header.className =
            "site-header " +
            (solid ? "site-header--solid" : "site-header--transparent");
        }

        function render() {
          state.route = parsePath(currentPath());
          state.activeCategoryIndex = 0;

          const main = $("#main");
          main.innerHTML = renderView();

          renderHeader();
          $("#site-footer").innerHTML = renderFooter();

          const { name } = state.route;
          if (name === "home" || name === "event") {
            initHero();
            initCountdown();
            initCalendarLinks();
          }
          if (name === "home" || name === "categories" || name === "category")
            initCategoryFilter();
          if (name === "home" || name === "nominees") initNomineeFilter();
          if (name === "home" || name === "faq") initFaq();
          if (name === "home" || name === "gallery") {
            $$("[data-gallery-index]").forEach((btn) => {
              btn.addEventListener("click", () =>
                openLightbox(Number(btn.dataset.galleryIndex)),
              );
            });
          }
          if (name === "vote") initVoteView();
          if (name === "review") initReviewView();
          if (name === "contact") initContactForm();
          if (name === "success" || name === "event") initCalendarLinks();

          initReveal();
          initCounters();

          window.scrollTo({ top: 0, behavior: "auto" });
          updateHeaderState();
          updateMeta();
        }

        /* ==========================================================================
   16. BOOT
   ========================================================================== */
        let scrollRaf = null;
        window.addEventListener(
          "scroll",
          () => {
            if (scrollRaf) return;
            scrollRaf = requestAnimationFrame(() => {
              updateHeaderState();
              scrollRaf = null;
            });
          },
          { passive: true },
        );

        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && drawerCleanup) {
            const closeBtn = $(".drawer__close");
            if (closeBtn) closeBtn.click();
          }
        });

        /* Initialise EmailJS if credentials are present */
        (function initEmailjs() {
          const c = CONFIG.emailjs;
          const ready =
            window.emailjs &&
            c.publicKey &&
            c.publicKey !== "YOUR_PUBLIC_KEY_HERE";
          if (ready) {
            try {
              window.emailjs.init({ publicKey: c.publicKey });
              console.info("[PFEA] EmailJS initialised.");
            } catch (err) {
              console.warn("[PFEA] EmailJS initialisation failed:", err);
            }
          } else {
            console.info(
              "[PFEA] EmailJS credentials not set. Add publicKey, serviceId and templateId in CONFIG.emailjs to enable real ballot submission.",
            );
          }
        })();

        initLinkInterception();
        render();

        window.PFEA = {
          CONFIG,
          CATEGORIES,
          NOMINEES,
          VotingService,
          state,
          navigate,
        };
      })();
    </script>
  </body>
</html>
